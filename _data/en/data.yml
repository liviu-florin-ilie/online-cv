career-profile:
    title: Career Profile
    summary: |
      I am a  seasoned (20+ years) Software Developer who lives by this: 
      \"Do what you can, with what you have, where you are\". 
      This allowed me to perform in different company cultures, different team setups 
      and also ever changing tech-stacks. Worked as a full-stack developer developing 
      software in Java, Groovy, Python, Scala, SQL, Swing, JSP, Typescript, Cypher.
      Built production ready software for various industries and end users:
        - experience with building, improving and using CI/CD-pipelines med Jenkins, GitLab, Tanzu och Docker
        - Procurement and resale
        - Mobile Gaming in the Payments Area
        - Financial Sector
        - eLearning
        - Task Management
      I was also involved in configuration of CI pipelines involving WebSphere application
      servers and internal CI tools. I am a creative, resilient, open and helpful person.
      I worked with great people who helped me grow both my technical and soft skills.
      
      This is my take on software development:
      The software developer nowadays has to fill in different roles:
        - assess and take care of the most important tasks
        - one can be a fireman when something \"catches fire\",         
        - one can be an archaeologist when there is no handover 
        - or even a private detective when there are things he needs to accomplish ones tasks 
          and has to look for the people that can provide help,
        - sometimes one can act as a translator as there are things that not all people can understand, 
        - one can even be the housekeeping lady when no one else dares doing the dirty work, 
        - one must be a teacher in order to share what he has acquired,
        - and sometimes one can be what he is destined to be: an architect and a builder.
