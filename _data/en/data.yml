career-profile:
  title: Career Profile
  summary: |
    Senior fullstack developer with more than 20 years of experience developing and maintaining business-critical systems in cross-functional, agile teams. I have over ten years of direct Java/J2EE experience and have continued working in the JVM ecosystem with Kotlin, Groovy, Scala, Spring Boot and Quarkus. On the frontend, I have several years of experience with TypeScript and Angular and am comfortable working across backend, frontend, integrations and delivery environments.

    Integrations and microservices have been a recurring focus throughout my career. At LeoVegas, I developed payment integrations with external providers in a microservices architecture. At Tietoevry, I worked on two Quarkus applications and communication flows for SOS-VIDEO for 112, as well as integrations with external systems.

    I have experience in automated testing and quality assurance of system flows. At Dell, I rewrote and improved an automated testing framework to verify code against expected outcomes. My practical experience with dedicated performance-test automation is more limited, but I am used to developing, troubleshooting and assuring the quality of integrations in complex production environments.

    I have worked with Docker, Kubernetes, GCP and AWS, as well as build and deployment pipelines using GitLab, Jenkins and Artifactory. As a team lead and architect, I was responsible for three developers, provided technical guidance and drove architectural decisions. I actively contribute to collaboration, knowledge sharing and shared responsibility for quality within the team.

