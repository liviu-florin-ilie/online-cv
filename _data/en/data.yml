career-profile:
  title: Career Profile
  summary: |
    I am a senior backend developer with more than 20 years of experience in business-critical systems, including over ten years of direct Java/J2EE experience and continued work in the JVM ecosystem with **Java, Spring Boot, Quarkus and Kotlin**. My background includes **REST APIs, integrations and microservices** in emergency communication, payments, finance and e-learning.

    I have worked with container-based and cloud environments (**Docker, Kubernetes, Google Cloud, AWS**), CI/CD with GitLab and Jenkins, SQL and NoSQL databases, and monitoring with Datadog and ELK. The work has included code reviews, test automation, SSO, fraud-prevention rules and performance improvements, in collaboration with developers and other specialist teams.

    At UniCredit, I acted as team lead and solution architect for three developers on the Fund Transfer Price proof of concept, evaluating technology and contributing to technical decisions. At Tietoevry, I worked on integration and communication flows in SOS-VIDEO for 112 and participated in an LLM-based application modernization prototype using Python, LangChain, LangGraph and Elasticsearch.

    I use AI tools such as Codex, GitHub Copilot and IntelliJ AI to support code analysis, testing, debugging, refactoring and documentation, with review and quality assurance as part of the process. I am a certified **Microsoft Azure AI Engineer Associate (AI-102)**.

    I enjoy discussing technical alternatives, sharing knowledge and helping teams develop maintainable solutions. Based in Kalmar and available to start immediately.

