experiences:
  title: Experience
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sweden
      summary: Backend development in Java/Quarkus and Spring Boot for critical emergency communication flows (SOS-VIDEO for 112), integrations on AWS and an LLM-based agent prototype.
      details: |
        - **SOS-VIDEO for 112:** Developed, integrated and quality-assured the backend flow for video calls to 112 using Quarkus applications on top of Janus and an in-house SIP stack – a critical public-safety system with high stability requirements. Automated the deployment pipeline with GitLab CI/CD, Ansible and Docker.
        - **AI Application Modernization POC:** Built an LLM-based agent prototype with Python, LangChain, LangGraph, Chainlit and Elasticsearch that gathers and analyses project data to suggest improvements and modernization of existing systems. Packaged with Docker Compose.
        - **RSS (AWS):** Developed backend features for database clean-up and an API integration with the Upsales CRM in a trading application on AWS (NestJS/Node.js, GraphQL, Neo4j).
        - **Friends MDT:** Built the backend and data model for a digital survey and reporting system with Spring Boot, Kotlin, JPA and PostgreSQL, deployed on AWS.
        - **Driftorder:** Built a demo application with Spring Boot and Flowable (BPMN), including the Form.io integration, for customer workshops.

        **Tech stack:** Java, Quarkus, Spring Boot, Kotlin, JPA, PostgreSQL, Neo4j, NestJS/Node.js, GraphQL, Python, LangChain, LangGraph, Elasticsearch, AWS, GitLab CI/CD, Ansible, Docker, TypeScript and Angular.

    - role: Software Developer, Payments
      time: 2021/05 - 2023/05
      show: True
      company: LeoVegas, Remote-Sweden
      summary: Built payment integrations and a fraud-prevention rule engine in Kotlin/JVM microservices on Kubernetes in Google Cloud.
      details: |
        - Built two card payment integrations (including Adyen and PCI Proxy) and a rule engine that selected the payment provider per market – lowering transaction costs and strengthening security and compliance by stopping unwanted and suspicious transactions.
        - Worked in a distributed microservice architecture handling payment flows of around 30 MEUR per month; evolved the data layer with SQL/Liquibase and JPA entities together with the data team.
        - Took part in the whole chain: analysis, implementation, code reviews, CI/CD deployment and monitoring of microservices in Marathon and Kubernetes on Google Cloud. Troubleshot with Datadog and ELK and proposed improvements to the deployment process. Also took part in technical interviews when hiring developers.

        **Tech stack:** Kotlin, in-house Spring Boot-like framework, REST, microservices, JPA, MySQL, Liquibase, Docker, Kubernetes, Marathon, Google Cloud, Datadog and the ELK stack.<br />
        **Team:** 3–5 stream members, 30+ in the extended team.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Romania
      summary: Built backend and automation tools for risk assessment, test automation and CI/CD in finance.
      details: |
        - Built a tool that automated monitoring and deployment of 20+ Blaze instances through CI/CD with GitLab, Artifactory and Pivotal Cloud Foundry – simplifying releases and monitoring during high season.
        - Rewrote and improved an automated test framework so developers could verify code and system flows against expected results and catch regressions earlier.
        - Developed an application for reviewing and verifying suspicious transactions that replaced manual Excel work and improved the quality of risk assessment.
        - Integrated SSO with Waffle for safer login and correct authorization – took over the task when a colleague was stuck.
        - Implemented Blaze FICO rules to reduce risk in customer loan applications.

        **Tech stack:** Groovy (JVM), Servlets, Akka, MongoDB, Angular, GitLab CI/CD, Artifactory and Pivotal Cloud Foundry.

    - role: Senior Software Developer
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bucharest
      summary: Modernized Java monoliths into microservices and led the architecture of a Spring Boot/Spring Batch platform on Docker.
      details: |
        - Contributed to critical parts of GPT (Global Pricing Tool) when it was rebuilt from a Java monolith into microservices in Scala, Python (calculation engine), Hazelcast (cache) and Angular, deployed on Docker.
        - Drove the introduction of unit tests to raise code quality during the rebuild, and led stakeholder discussions on performance and on the improved precision when BigDecimal replaced Float.
        - Acted as **team lead and architect** for three developers on the Fund Transfer Price initiative: designed a new platform with Spring Boot, Spring Batch, MyBatis and Vaadin on top of the existing Teradata database, built CI/CD with Jenkins and deployed Docker modules on Mesos/Marathon.
        - Migrated the BUL batch platform (EJB, JMS) to new WebSphere servers and the Gandalf CI/CD tool, removing a dependency on Tibco GRID and saving several hundred thousand dollars per year.

        **Tech stack:** Java, Spring Boot, Spring Batch, MyBatis, EJB, JMS, Scala, Python, Hazelcast, Teradata, Jenkins, Docker and Mesos/Marathon.

    - role: Java Developer
      time: 2011/10 - 2015/03
      show: True
      company: Intuitext/Softwin, Bucharest
      summary: Built Java web applications and learning platforms with Spring, Hibernate, PostgreSQL and MySQL.
      details: |
        Developed and maintained LMS, LCMS and assessment platforms for schools, professionals and banks – data modelling, persistence layers and web applications.<br />
        **Tech stack:** Java, Spring, Spring MVC, Hibernate, Struts, JSP, PostgreSQL, MySQL, Maven, Tomcat and JBoss.

    - role: Java Developer
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bucharest
      summary: Built Java integrations with external websites (HTTP Client, HTML parsing, XML) with persistence in MySQL.

    - role: Fullstack Java Developer
      time: 2007/06 - 2009/03
      show: False
      company: Concept Data, Bucharest
      summary: Built a Java project management platform (TasKAFE) with Spring, Hibernate, Oracle and PostgreSQL.

    - role: Java Developer
      time: 2005/04 - 2007/06
      show: False
      company: Genesys and INGENIO-UCS, Bucharest
      summary: Java intranet and banking applications with Struts, JSF, JSP and Servlets; JDBC, SQL and stored procedures on Oracle and SQL Server.


