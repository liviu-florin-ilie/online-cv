experiences:
  title: Experience
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sweden
      details: |
        I was involved in several projects.<br /><br />
        **SOS-VIDEO for 112** – The purpose of the project was to add video to an existing 112 emergency call by sending an
        SMS message containing a link that the caller could open to establish a video connection with the operator handling the call.
        This was achieved using an open-source stack with Janus as the video server, an internally developed SIP stack, and two Quarkus applications
        at the top of the flow.
        The deployment pipeline was automated with GitLab, Ansible, and on-premises Docker.
        **Technology stack:** Java, Quarkus, SIP, Janus, Docker, GitLab CI/CD, and Ansible.<br /><br />
        **Driftorder Demo Application** – A demonstration application for the Driftorder BPMN process, built with Spring Boot and Flowable.
        I developed the integration with Form.io.
        **Technology stack:** Java, Spring Boot, Flowable, BPMN, and Form.io.<br /><br />
        **AI Application Modernization POC** – An AI-based application developed to help developers collect and analyze project data and identify opportunities for improvement and modernization.
        This was my first involvement in an AI project, and I gained hands-on experience with tools such as
        Chainlit, LangGraph, LangChain, and Elasticsearch, while refreshing my knowledge of
        Docker Compose and Python.
        **Technology stack:** Python, Chainlit, LangGraph, LangChain, Elasticsearch, and Docker Compose.<br /><br />
        **RSS** – Full-stack development for an AWS application supporting a company
        engaged in commercial trading of small electronic components. I was responsible for development, maintenance, and integration with
        another system, Upsales.
        **Technology stack:** Neo4j with Cypher, TypeScript with NestJS and Angular, GraphQL, and AWS.<br /><br />
        **Friends MDT** – Development of digital survey tools for the Friends Foundation in its work against bullying and harassment.
        The application was used to collect data from schools through surveys in order to visualize
        and analyze the results.
        After collection, a complex research-based report was generated to show children's well-being at school.
        Technology stack: PostgreSQL, Neo4j, Spring Boot with Kotlin, Angular, AWS, and Amazon Cognito for user and identity management.
        During the project's first phase, we used VMware Tanzu for CI/CD.

    - role: Software Developer @Payments
      time: 2021/05 - 2023/05
      show: True
      company: Leovegas, Remote-Sweden
      details: |
        The team in the Payments department builds and maintains payment integrations
        between our core systems and various payment providers and payment methods,
        enabling players to deposit and withdraw money smoothly.
        My role was in the card stream, which specifically handled card-payment integrations.
        Our goal was to lower the cost per payment, expand our available payment methods,
        and reduce the risk of payment fraud.
        As a member of the card stream, I was involved in building two payment-provider integrations
        and the rules engine used to create risk and fraud-prevention rules.
        **Technology stack:** A microservices architecture built on an internal Spring Boot-like framework
        with Kotlin and MySQL as the database. We deployed our microservices to Google Cloud and
        used Kubernetes as the container platform.<br />
        **Team:** 3–5 stream members, 30+ extended team members
        <br /><br />

    - role: Principal Software Engineer
      show: False
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Romania
      details: |
        Our department's objective was to reduce risk when a customer applied for a loan.
        I was involved in building tools that helped automate certain tasks within our department.
        I built a web application that automated the monitoring and deployment of our 20+ Blaze instances. In this project,
        we built a CI/CD pipeline using GitLab, Artifactory, and Pivotal Cloud Foundry. The application increased satisfaction
        among our colleagues responsible for releasing new versions and made it easier to monitor
        our instances during peak periods. Technology stack: Angular, Groovy, Servlets, and MongoDB.
        I was involved in creating a web application that helped our colleagues review and verify suspicious
        transactions. Technology stack: Angular, Groovy, Servlets, and MongoDB. I rewrote and improved
        an existing automated testing framework that enabled our developers to test their code against
        expected outcomes.
        I also integrated SSO functionality into our web applications using Waffle.
        **Team:** Each project team consisted of a team lead and one or two developers.
        **Technology stack:** Groovy, MongoDB, Akka, Angular, Servlets, GitLab CI/CD, Artifactory, Pivotal Cloud Foundry, and Waffle SSO.

    - role: Senior Software Developer
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bucharest
      details: |
        I worked on various pricing engines for our UniCredit colleagues in Italy.<br /><br />
        **GPT (Global Pricing Tool)** – We rebuilt this project from a monolith based on a Java technology stack
        into a microservices infrastructure using Scala for the microservices, Python for
        the calculation engine, Hazelcast for data caching, and Angular for the frontend. We also used SBT
        to build the Scala microservices. We aimed to provide users with a better experience
        and achieved this by improving the web application's speed and resilience. The microservices
        were ultimately deployed using Docker.
        **Team:** The project team consisted of a technical analyst, a business analyst, and six developers.
        We worked according to agile methodology.
        **Technology stack:** Java, Scala, Play Framework, SBT, Python, AngularJS, JavaScript, Hazelcast, Teradata SQL, Spring Batch, Maven, WebSphere, JasperReports, Jenkins, Jira, Docker, and microservices.<br /><br />
        **BUL Batch Platform/Calculation Engine** – For four months, I contributed to migrating a critical application to a new server infrastructure. An important part of the work was integrating the application with the company's servers
        and CI/CD pipelines. This involved collaborating with the team responsible for the WebSphere servers and the team
        managing the CI/CD tool (Gandalf), because I could not perform certain configurations independently.
        **Technology stack:** EJB 2.0, JMS, WebSphere 5 and 8, and internal CI/CD tooling.<br /><br />
        **BUL-CT1** – I managed the application handover from another department, coordinating the transfer of technical knowledge and operational responsibility.
        **Technology stack:** EJB 2.0, JMS, WebSphere 6 and 8, and internal CI/CD tooling.<br /><br />
        **Fund Transfer Price** – I built a POC for the Fund Transfer Price platform—a batch platform/calculation engine—using an open-source stack:
        Spring Batch, Spring Boot, MyBatis, and Vaadin, while retaining the existing Teradata database. We built our CI/CD pipeline with Jenkins and used Docker for the modules.
        **Technology stack:** Java, Spring Batch, Spring Boot, MyBatis, Vaadin, Teradata, Jenkins, and Docker.
        **Team:** I acted as team lead/architect in this role and was responsible for three other developers.<br /><br />
        **Exonus** – I also had a smaller role in this extract/load and reporting project, contributing as a senior developer and architecture advisor.
        **Technology stack:** Spring Boot, Spring Cloud, MongoDB, SQL databases, BIRT, and Angular 2.

    - role: Java Developer
      time: 2011/10 - 2015/03
      company: Intuitext/Softwin, Bucharest
      details: |
        I worked on LMS (Learning Management System), LCMS (Learning Content Management System), and assessment platforms
        that helped students and professionals acquire knowledge, follow online courses, measure progress, and assess learning outcomes.<br /><br />
        **INSAM** – An evaluation platform for Romanian high-school students. I developed features and resolved defects.
        **Technology stack:** Java, Hibernate, Spring, Struts 1, MySQL, BIRT, and Tomcat.<br /><br />
        **ISMB-SIND, CMBRAE, and FORCAD-VN** – I adapted existing modules and developed new functionality according to customer requirements.
        **Technology stack:** Java, MySQL, Hibernate, Spring, Spring MVC, JSP, jQuery, and Tomcat.<br /><br />
        **Matematici and PREVINS** – I developed and maintained learning and assessment functionality.
        **Technology stack:** Java, Spring MVC, Maven, jQuery, Hibernate, Spring, PostgreSQL, and Tomcat.<br /><br />
        **Alpha Bank and ING e-learning platforms** – SCORM-based learning platforms that I developed and maintained.
        **Technology stack:** Java, Struts, Hibernate, MySQL, SCORM, and JBoss.

    - role: Java Developer
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bucharest
      details: |
        I developed and maintained an application for property and title searches by integrating new websites
        using the HTTP Client API, HTML Parser API, regular expressions, and XML. The information collected from the integrated websites was then stored in the application's MySQL database for later use.
        The purpose of the Title Search application was to enable users to collect all available information about a property or property seller, making the property transaction as safe as possible and minimizing risks that could affect the buyer.
        **Technology stack:** Java, GWT, JSP, Servlets, MySQL, HTML Parser, HTTP Client, XML, regular expressions, and Resin.
        **Team:** Eight developers, three testers, and one development lead.

    - role: Full-stack Java Developer
      time: 2007/06 - 2009/03
      company: Concept Data, Bucharest
      details: |
        TasKAFE was a project-management application with features for resource allocation, time and cost tracking, and reporting. New modules were developed for HR, inventory, accounting, and document management.
        **Technology stack:** Java, Swing, Hibernate, Oracle, PostgreSQL, Spring, JSF, RMI, Java Web Start, Ant, Maven, JUnit, iText, and JasperReports.
        The team consisted of five developers and one tester.

    - role: Full-stack Java Developer
      time: 2007/02 - 2007/06
      company: Genesys, Bucharest
      details: |
        **Gesy Framework** – I maintained and extended an internal application framework.
        **Technology stack:** Java, JSF, Ajax, SWT, and Microsoft SQL Server.

    - role: Full-stack Java Developer
      time: 2005/04 - 2007/02
      company: INGENIO-UCS, Bucharest
      details: |
        I developed and supported internal and customer-facing applications, including credit-assessment and loan-calculation solutions for Romanian banks.<br /><br />
        **Allia Intranet** – I developed new functionality and resolved defects in an internal web application.
        **Technology stack:** Java, Struts, JSP, Servlets, jQuery, and MySQL.<br /><br />
        **Neural-BCR** – I maintained a credit-assessment and loan-calculation application for BCR.
        **Technology stack:** Java, Struts, JSP, Servlets, Oracle, and PL/SQL.

