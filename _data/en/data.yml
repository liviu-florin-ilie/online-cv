experiences:
    title: Experiences
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sweden
        details: |
          **SOS-VIDEO for 112** – Added video to an existing emergency call by sending an SMS link that establishes a video connection between the caller and the operator. The solution used Janus as the video server, an internal SIP stack and two Quarkus applications. I worked on development, integrations and quality assurance of the connected communication flows. The deployment pipeline was automated with GitLab, Ansible and Docker in an on-premises environment.
          <br /><br />
          **Driftorder Demo Application** – A demonstration application for the Driftorder BPMN process, built with Spring Boot and Flowable. I built the integration with Form.io.
          <br /><br />
          **AI Application Modernization POC** – An AI application to help developers collect project data and identify opportunities for improvement and modernisation. This was my first AI project and gave me hands-on experience with Chainlit, LangGraph, LangChain and Elasticsearch, while refreshing my Docker Compose and Python skills.
          <br /><br />
          **RSS** – Fullstack development of an AWS application supporting a business trading in small electronic components. I was responsible for development, maintenance and integration with Upsales.
          **Technology stack:** Neo4j/Cypher, TypeScript, NestJS, Angular, GraphQL and AWS.
          <br /><br />
          **Friends MDT** – Development of digital survey tools for the Friends foundation's work against bullying and harassment. The application collected, visualised and analysed school survey data, generating a complex research-based report on children's wellbeing at school. It used PostgreSQL, Neo4j, Spring Boot with Kotlin and Angular, deployed on AWS. In the initial phase, we used VMware Tanzu for CI/CD.

      - role: Software Developer @Payments
        show: True
        time: 2021/05 - 2023/05
        company: Leovegas, Remote-Sweden
        details: |
          The Payments team built and maintained integrations between our core systems and payment providers, enabling players to deposit and withdraw funds smoothly. I worked in the card payments stream, aiming to reduce payment costs, expand payment methods and lower fraud risk. I helped build a payment integration and the rule engine for risk and fraud prevention.
          **Technology stack:** A microservices architecture using an internal Spring Boot-like framework, Kotlin and MySQL. We deployed the microservices on Google Cloud and used Kubernetes as the container platform.<br />
          **Team:** 3–5 stream members, with an extended team of over 30.

      - role: Principal Software Engineer
        show: True
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Romania
        details: |
          Our department aimed to reduce risk when customers applied for loans. I helped build tools to automate departmental tasks.
          <br />
          I built a web application to automate monitoring and deployment of over 20 Blaze instances, including a CI/CD pipeline with GitLab, Artifactory and Pivotal Cloud Foundry. This improved the release process and made monitoring easier during peak periods. Technology stack: Angular, Groovy, Servlets and MongoDB.
          <br />
          I helped develop a web application for reviewing suspicious transactions, using Angular, Groovy, Servlets and MongoDB. I rewrote and improved an automated testing framework so developers could verify code and system flows against expected outcomes and detect regressions earlier. I also integrated SSO into our web applications using Waffle.
          <br />
          **Technology stack:** Groovy, MongoDB, Akka and Angular.<br />
          **Team:** A team lead and one or two developers per project.

      - role: Senior Software Developer
        show: True
        time: 2015/03 - 2018/03
        company: UniCredit Services, Bucharest
        details: |
          I worked on pricing engines for UniCredit colleagues in Italy.
          <br />
          **GPT (Global Pricing Tool)** – We rebuilt a Java monolith as microservices using Scala, Python for the calculation engine, Hazelcast for caching and Angular for the frontend. We used SBT to build the Scala microservices and deployed them with Docker, improving application speed and resilience.
          **Team:** A technical analyst, a business analyst and six developers, working with agile methods.
          <br />
          **BUL batch platform/calculation engine** – For four months, I contributed to migrating a critical application to new server infrastructure and integrating it with company servers and CI/CD pipelines. I coordinated with the WebSphere and Gandalf CI/CD teams. The stack included EJB 2.0, JMS, and WebSphere 5 and 8.
          <br />
          **Fund Transfer Price** – I built a proof of concept for a batch platform/calculation engine using Spring Batch, Spring Boot, MyBatis and Vaadin, retaining the existing Teradata database. We built CI/CD with Jenkins and used Docker for the modules.
          **Leadership:** As team lead and architect, I was responsible for three other developers, provided technical guidance, coordinated development and drove architectural decisions with the team.

      - role: Java Developer
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bucharest
        details: |
          I worked on e-learning projects using LMS (Learning Management Systems) and LCMS (Learning Content Management Systems). These platforms helped students and professionals acquire knowledge and skills through online courses, progress tracking and knowledge assessment.

      - role: Java Developer
        show: True
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bucharest
        details: |
          I developed and maintained an application for property and ownership research, integrating external websites using the HTTP Client API, HTML Parser API, regular expressions and XML. The collected data was stored in MySQL. The application helped users gather information about properties and sellers to identify risks affecting buyers.
          **Technology stack:** GWT, Servlets, MySQL and Resin.<br />
          **Team:** Eight developers, three testers and one development lead.

      - role: Fullstack Java Developer
        time: 2007/06 - 2009/03
        company: Concept Data, Bucharest

      - role: Fullstack Java Developer
        time: 2007/02 - 2007/06
        company: Genesys, Bucharest

      - role: Fullstack Java Developer
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bucharest
          

