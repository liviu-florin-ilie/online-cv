career-profile:
  title: Career Profile
  summary: |
    I am an experienced software developer with more than 20 years of experience developing and enhancing business-critical systems.
    My background is primarily in backend development, complemented by experience in solution architecture, system integrations,
    cloud and container platforms, CI/CD, and technical leadership.

    I have more than ten years of direct Java/J2EE experience and have continued working within the JVM ecosystem with technologies
    including Kotlin, Groovy, Spring Boot, and Quarkus. I have worked with distributed systems, microservices, APIs, and integration architecture,
    as well as AWS, GCP, Kubernetes, Docker, VMware Tanzu, WebSphere, GitLab CI/CD, and Jenkins.

    At UniCredit, I acted as team lead/solution architect for a period and was responsible for a POC for a new Fund Transfer Price platform.
    The work included technical decisions concerning architecture, frameworks, batch processing, database integration, containerization, and CI/CD.

    At Tietoevry, I worked with both cloud-based and on-premises solutions. In SOS-VIDEO for 112, I worked with integration and communication
    flows in a solution based on technologies including SIP, Janus, Quarkus, Docker, and GitLab.

    My extensive development background enables me to combine an architectural perspective with an understanding of how technical decisions affect
    implementation, integration, deployment, and long-term maintenance. I enjoy seeing the bigger picture, discussing technical alternatives,
    and contributing to solutions that are robust, secure, and sustainable over time.

