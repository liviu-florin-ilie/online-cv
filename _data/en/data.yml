career-profile:
  title: Career Profile
  summary: |
    **Senior full-stack developer with over 20 years of experience** in business-critical systems, including over ten years with Java/J2EE.
    I want to contribute to Fortnox's Kronos team with **Java, Kotlin, Spring Boot, microservices and SQL**, payments experience and a business-focused approach.

    At LeoVegas, I developed payment integrations using Kotlin. At Tietoevry, I worked with Spring Boot, Kotlin, PostgreSQL, TypeScript and Angular, as well as an **AI-based proof of concept for application modernization**.
    At UniCredit, I modernized pricing platforms and led a proof of concept using Spring Boot and Spring Batch.

    For me, being a developer means being a **detective, archaeologist, builder and architect**.
    I look for clues in business needs, examine layers of code and past decisions, build working solutions and weigh technical alternatives to establish a sustainable direction.
    As a **translator**, I make technical trade-offs understandable and build shared understanding within the team, staying close to implementation.
    Based in Kalmar, with professional proficiency in Swedish and English.
