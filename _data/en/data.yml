career-profile:
  title: Career Profile
  summary: |
    Senior backend developer with 20+ years of experience building business-critical systems, including more than ten years of Java/J2EE followed by modern JVM development with **Java, Spring Boot, Quarkus and Kotlin**. I have built **REST APIs, integrations and microservices** for emergency services (SOS-VIDEO for 112), payments, finance and e-learning, taking solutions all the way from idea and data model to production and operations.

    I have worked in container-based and cloud environments (**Docker, Kubernetes, Google Cloud, AWS**), with CI/CD in GitLab and Jenkins, SQL and NoSQL databases, and monitoring with Datadog and ELK. Quality, security and scalability have been central to my work: code reviews, test automation, SSO, fraud-prevention rules and performance tuning. As team lead and architect I have driven technical decisions, coached developers and taken part in hiring.

    **AI is a natural part of how I develop software.** I use AI tools such as Codex, GitHub Copilot and IntelliJ AI to analyse large codebases, write tests, debug, refactor and document – while owning the review and the quality of the result. At Tietoevry I built an LLM-based agent prototype for application modernization with Python, LangChain, LangGraph and Elasticsearch, and I am a certified **Microsoft Azure AI Engineer Associate (AI-102)**.

    I live by the motto "do what you can, with what you have, where you are" and enjoy technically challenging consulting assignments alongside other experienced developers. Based in Kalmar and available to start immediately.

