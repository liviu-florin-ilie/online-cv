experiences:
  title: Experience
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sweden
      summary: Backend development in Java/Quarkus and Spring Boot for critical emergency communication flows (SOS-VIDEO for 112), integrations on AWS and an LLM-based agent prototype.
      details: |
        - **SOS-VIDEO for 112:** Contributed to backend development, integration and quality assurance of the flow for video calls to 112 using Quarkus applications on top of Janus and an in-house SIP stack – a critical public-safety system with high stability requirements. The deployment pipeline was automated with GitLab CI/CD and Docker.
        - **AI Application Modernization POC:** Participated in developing an LLM-based agent prototype with Python, LangChain, LangGraph, Chainlit and Elasticsearch that gathers and analyses project data to suggest improvements and modernization of existing systems. Packaged with Docker Compose.
        - **RSS (AWS):** Worked on backend features for database clean-up and an API integration with the Upsales CRM in a trading application on AWS (NestJS/Node.js, GraphQL, Neo4j).
        - **Friends MDT:** Contributed to backend development and data modelling for a digital survey and reporting system with Spring Boot, Kotlin, JPA and PostgreSQL, deployed on AWS.
        - **Driftorder:** Worked on a demo application with Spring Boot and Flowable (BPMN), developing the Form.io integration for customer workshops.

        **Tech stack:** Java, Quarkus, Spring Boot, Kotlin, JPA, PostgreSQL, Neo4j, NestJS/Node.js, GraphQL, Python, LangChain, LangGraph, Elasticsearch, AWS, GitLab CI/CD, Docker, TypeScript and Angular.

    - role: Software Developer, Payments
      time: 2021/05 - 2023/05
      show: True
      company: LeoVegas, Remote-Sweden
      summary: Contributed to payment integrations and a fraud-prevention rule engine in Kotlin/JVM microservices on Kubernetes in Google Cloud.
      details: |
        - As part of the card stream, contributed to two card payment integrations (including Adyen) and a rule engine for payment-provider selection and risk and fraud prevention. The team aimed to lower transaction costs, expand payment options and reduce payment fraud.
        - Worked in a distributed microservice architecture handling payment flows of around 30 MEUR per month; collaborated with the data collection team to store and communicate the fields they needed for data collection.
        - Took part in the whole chain: analysis, implementation, code reviews, CI/CD deployment and monitoring of microservices in Marathon and Kubernetes on Google Cloud. Troubleshot with Datadog and ELK and proposed improvements to the deployment process. Also took part in technical interviews when hiring developers.

        **Tech stack:** Kotlin, in-house Spring Boot-like framework, REST, microservices, JPA, MySQL, Liquibase, Docker, Kubernetes, Marathon, Google Cloud, Datadog and the ELK stack.<br />
        **Team:** 3–5 stream members, 30+ in the extended team.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Romania
      summary: Contributed to backend and automation tools for risk assessment, test automation and CI/CD in finance.
      details: |
        - Contributed to a tool that automated monitoring and deployment of 20+ Blaze instances through CI/CD with GitLab, Artifactory and Pivotal Cloud Foundry – simplifying releases and monitoring during high season.
        - Rewrote and improved an automated test framework so developers could verify code and system flows against expected results and catch regressions earlier.
        - Participated in developing an application for reviewing and verifying suspicious transactions that replaced manual Excel work and improved the quality of risk assessment.
        - Integrated SSO with Waffle for safer login and correct authorization.
        - Implemented Blaze FICO rules to reduce risk in customer loan applications.

        **Tech stack:** Groovy (JVM), Servlets, Akka, MongoDB, Angular, GitLab CI/CD, Artifactory and Pivotal Cloud Foundry.

    - role: Senior Software Developer
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bucharest
      summary: Contributed to pricing and batch platform modernization and acted as team lead and architect for a Spring Boot/Spring Batch proof of concept.
      details: |
        - Contributed to the modernization of GPT (Global Pricing Tool) when it was rebuilt from a Java monolith into microservices in Scala, Python (calculation engine), Hazelcast (cache) and Angular, deployed on Docker. The GPT project also used Mesos and Jenkins.
        - Worked with the team to introduce unit tests during the rebuild and took part in stakeholder discussions on performance and on the improved precision when BigDecimal replaced Float.
        - Acted as **team lead and architect** for three developers on the Fund Transfer Price initiative: evaluated technology and developed a proof of concept with Spring Boot, Spring Batch, MyBatis and Vaadin on top of the existing Teradata database. The work also included CI/CD with Jenkins.
        - Contributed to migrating the BUL batch platform (EJB, JMS) to new WebSphere servers and integrating it with the Gandalf CI/CD tool, in collaboration with the infrastructure and CI/CD teams.

        **Tech stack:** Java, Spring Boot, Spring Batch, MyBatis, EJB, JMS, Scala, Python, Hazelcast, Teradata, Jenkins, Docker and Mesos.

    - role: Java Developer
      time: 2011/10 - 2015/03
      show: True
      company: Intuitext/Softwin, Bucharest
      summary: Developed and maintained Java web applications and learning platforms with Spring, Hibernate, PostgreSQL and MySQL.
      details: |
        Worked on the development and maintenance of LMS, LCMS and assessment platforms for schools, professionals and banks – data modelling, persistence layers and web applications.<br />
        **Tech stack:** Java, Spring, Spring MVC, Hibernate, Struts, JSP, PostgreSQL, MySQL, Maven, Tomcat and JBoss.

    - role: Java Developer
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bucharest
      summary: Built Java integrations with external websites (HTTP Client, HTML parsing, XML) with persistence in MySQL.

    - role: Fullstack Java Developer
      time: 2007/06 - 2009/03
      show: False
      company: Concept Data, Bucharest
      summary: Contributed to a Java project management platform (TasKAFE) with Spring, Hibernate, Oracle and PostgreSQL.

    - role: Java Developer
      time: 2005/04 - 2007/06
      show: False
      company: Genesys and INGENIO-UCS, Bucharest
      summary: Java intranet and banking applications with Struts, JSF, JSP and Servlets; JDBC, SQL and stored procedures on Oracle and SQL Server.


