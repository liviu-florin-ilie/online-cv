experiences:
    title: Experiences
    info:
      - role: Lead Solutions Consultant
        time: 2023/05 - 2023/08
        company: Tietoevry, Kalmar, Sweden
        details: |
          Was involved in several projects.
          
          SOS-VIDEO for 112 Emergency Services - The purpose of the project was to add video capabilities to existing 112 emergency calls by sending a 
          SMS containing a link that the caller can open to establish a video connection with the operator handling the call.
          This was achieved using an open-source technology stack consisting of Janus as the video server, an internally developed SIP stack, and two Quarkus applications 
          at the top of the processing flow.
          The deployment pipeline was fully automated using GitLab, Ansible, and Docker.

          BPMN process runner Demo Application - A demo application for the handling BPMN processes built with Spring Boot and Flowable. I was responsible for 
          implementing the integration with Form.io.

          AI Application Modernization POC - AI app to assist devs.
          gather project data, offer solutions for improvement and modernization.
          Got a first contact with an AI project and got some hands on experience with tools like 
          Chainlit, LangGraph, LangChain, Elasticsearch and refreshed some other
          Docker Compose och Python.
          
          RSS - I worked with full-stack development for an application hosted on AWS, that is meant 
          to support the activities of a company that works in a niche market of dealing micro-components 
          used in different industries and objects for a profit. 
          I have been responsible for development and maintenance. 
          Did an integration with another system, Upsales.
          Some of the tech stack used here involved Neo4j, Cypher, Typescript with NestJS and Angular and also 
          got more familiar with GraphQL and the AWS stack.

          Friends MDT- Development of digital tools for the Friends foundation to assist them in 
          their work against bullying and harassment. 
          Includes creating a new tool for collecting, visualizing, and analyzing inquiries done in
          schools. After the collection of the inquiries a complex report was generated. The report was 
          bases on research meant to show the actual feeling of the children in a school.
          The application had this stack Postgres, Neo4j, SpringBoot with Kotlin, Angular and all
          was deployed on AWS. In the first phase of the project we experimented with VmWares Tanzu
          platform.

      - role: Software Developer @Payments
        time: 2021/05 - 2023/05
        company: Leovegas, Remote-Sweden
        details: |
          The team in the Payments department builds and maintains payment integrations 
          between our core systems and different payment providers and payment methods 
          which enables the player to deposit and withdraw his money in a smooth way. 
          My role lies within the cards stream which deals specifically with the card 
          payments integrations. Our aim is to lower the cost of the price per payment, 
          expand our current payment methods and lower the fraud risk for the payments. 
          As a member of the Card stream I was involved in building one of our integrations 
          and the rule engine used to build rules for risk and fraud mitigation.
          
          Tech Stack: A microservices architecture built over an inhouse SpringBoot-ish framework 
          over Kotlin and MySql as a database.
          
          Team: 3-5 stream members, 30+ extended team
      - role: Principal Software Engineer
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Romania
        details: |
          Our department’s aim is to mitigate risk when a loan is requested by a customer.
          I am involved in building tools that help automate certain tasks in our department.
          Built a web app that automated the monitoring and deployment of our 20+ Blaze instances 
          by building a CI/CD pipeline with GitLab and Artifactory and Pivotal Cloud Foundry. 
          This app increased the happiness of our colleagues in charge of the release of new versions and eased the process of monitoring
          our instances during high season. Tech stack for this app: Angular, Groovy, Servlets, MongoDB.
          All of this was deployed in Pivotal Cloud 

          Was involved in creating a web-app that would help our colleagues overview and verify the suspect 
          transactions. Tech stack for this app: Angular, Groovy, Servlets, MongoDB. I rewrote and enhanced 
          an existing automated testing framework that allows our developers to test their code against 
          expected results.
          Also managed to integrate SSO functionality into our webapps using Waffle.
          The team for a project consists of team-lead and one or two developers
          
          Tech Stack: Groovy, MongoDB, Akka, Angular.
          
          Team: The team for a project consists of team-lead and one or two developers.          
      - role: Senior Software Developer, Lead Developer
        time: 2015/03 - 2018/03
        company: UniCredit Services, Bucharest
        details: |
          Worked on different "Pricing engines" for our Unicredit colleagues from Italy. The most 
          important one was GPT (Global Pricing Tool) which we rewrote from a monolith build on a Java 
          tech stack to a microservice infrastructure with Scala for the microservices, Python for 
          the calculation engine, Hazelcast for caching data, and Angular for the frontend. We also used SBT 
          for building the Scala microservices. We aimed to provide the users with a more pleasant experience 
          and we fully realized that by increasing the webapps speed and resilience. The microservices were 
          eventually deployed on Docker.
          
          The team for this project consisted of a technical analyst, business analyst and six developers. 
          We worked in an Agile way.  

          For 4 months I contributed on a migration of a crucial application, BUL-Batch platform/Calculation 
          engine to a new server infrastructure. One of the important parts of the job was integrating the application 
          into the company’s servers and CI/CD pipelines. This involved coordinating with the team responsible for the
          WebSphere servers, as well as the team managing the CI/CD software (Gandalf), since some of the configurations 
          could not be done independently.
          The tech-stack had EJB2.0, JMS, WebSphere 5 and 8. 
          
          I rearchitected Fund Transfer Price - Batch platform/Calculation Engine with an open-source 
          tech-stack: Spring Batch, Spring Boot, MyBatis, Vaadin, but using the previous Teradata database. 
          We built the CI/CD pipeline with Jenkins and used Docker for containerisation. Took it to MVP level.
          
          Also had a small role in Exonus project which was built with Spring Cloud infrastructure.
      - role: Fullstack Java Developer
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bucharest
        details: |
          I worked on several eLearning projects involving LMS (Learning Management Systems) and LCMS
          (Learning Content Management Systems). These platforms helped students and professionals acquire new
          knowledge and skills through online courses, progress tracking, and knowledge assessment. I worked with
          several technology stacks:
            - Hibernate, Spring, Struts 1, MySQL, BIRT, and Tomcat
            - Hibernate, Spring, Spring MVC, MySQL, JSP, jQuery, and Tomcat
            - Struts, Hibernate, MySQL, and JBoss
            - Jira for task and bug tracking

          We followed a Waterfall methodology, typically with two to four developers per project. The work was
          overseen by a team manager and a project manager, while the QA department supported testing and quality
          assurance.

      - role: Fullstack Java Developer
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bucharest
        details: |
          I developed and maintained the Title Search application by integrating new websites using the HttpClient
          API, an HTML parser API, regular expressions, and XML. Information collected from the integrated websites
          was stored in the application's MySQL database for later use.

          The application enabled users to collect available information about properties and property sellers,
          helping reduce risks to buyers during real-estate transactions.

          Tech stack: GWT, Servlets, MySQL, and Resin.
          The team consisted of eight developers, three testers, and one development lead.

      - role: Fullstack Java Developer
        time: 2007/06 - 2009/03
        company: Concept Data, Bucharest
        details: |
          We developed a task-management system using Hibernate, Swing, several Java APIs, the embedded Jetty server,
          and a PostgreSQL database. I was responsible for developing reporting tools used in communications with
          Romanian public authorities.

          I also contributed to a flexible reporting module by extending the functionality of JasperReports.

          Tech stack: Java, Hibernate, Swing, iText, JasperReports, JFreeChart, Jetty, and PostgreSQL.
          Tools: Eclipse.

      - role: Fullstack Java Developer
        time: 2007/02 - 2007/06
        company: Genesys, Bucharest
        details: |
          The company developed a web-based CRM system using JSF and Ajax, together with an SWT administration tool.
          The web client and administration tool were connected to a SQL Server database. I implemented features in
          the system's tree-based navigation menu.

          I also rebuilt a web-based ticketing application used to register and manage complaints about streetlights.

          Technologies and tools: JSF, Ajax, SWT, SQL Server, Eclipse, and TOAD.

      - role: Fullstack Java Developer
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bucharest
        details: |
          The company developed financial web applications using J2EE technologies for major Romanian clients. I
          worked on a prescoring application for a major Romanian bank. The system was developed using Struts, Java,
          Oracle Database, and PL/SQL.

          The project was large and the client had demanding requirements. At one point, I had to modify core parts
          of the application and completed the work within a tight deadline. Because the system supported many user
          categories, I was assigned responsibility for designing and implementing user and role administration. I
          designed an efficient solution inspired by Unix IP-filtering principles, without noticeable performance
          overhead.

          Tech stack: Oracle Database, PL/SQL, Java, Servlets, JSP, and Struts.
          Tools: Eclipse and TOAD.

