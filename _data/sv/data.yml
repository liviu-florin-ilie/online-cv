experiences:
  title: Erfarenheter
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar
      summary: Lösningar för samhällsviktig verksamhet, bl.a. SOS-VIDEO till 112 för SOS Alarm, med fokus på integrationer, verksamhetsprocesser och helhet.
      details: |
        - **SOS-VIDEO till 112 (SOS Alarm):** Utvecklade och integrerade videoflödet som låter den hjälpsökande dela video med operatören under ett pågående nödsamtal. Lösningen krävde samordning av flera komponenter och parter (Janus, intern SIP-stack, Quarkus-applikationer) samt hög tillgänglighet och säkerhet. Driftsättningen automatiserades och gjordes spårbar med GitLab, Ansible och Docker.
        - **Friends MDT:** Digitalt enkätverktyg för Friends arbete mot mobbning och kränkningar. Ersatte pappersenkäter och kompletterades med en forskningsbaserad rapport som gav skolor bättre beslutsunderlag kring elevers välmående. Identitets- och behörighetshantering med Amazon Cognito.
        - **Driftorder:** Tog fram en demoapplikation för en BPMN-modellerad verksamhetsprocess (Spring Boot, Flowable, Form.io) som användes i kunddialoger för att konkretisera hur processen kan stödjas digitalt.
        - **RSS:** Integration mot Upsales som förenklade säljarnas och köparnas dagliga arbete i en handelsapplikation på AWS.
        - **AI Application Modernization POC:** Visade hur AI kan stödja analys och modernisering av befintliga systemlandskap (Python, LangChain, LangGraph, Elasticsearch).

        **Teknik:** Java, Quarkus, Spring Boot, Kotlin, TypeScript, Angular, PostgreSQL, Neo4j, AWS, GitLab CI/CD, Ansible och Docker.

    - role: Systemutvecklare, Payments
      show: True
      time: 2021/05 - 2023/05
      company: LeoVegas, distans
      summary: Betalningsintegrationer och regelmotor för risk- och bedrägeribekämpning i en reglerad verksamhet.
      details: |
        - Byggde två kortbetalningsintegrationer och en regelmotor som valde betalningsleverantör per marknad, sänkte transaktionskostnaderna och stärkte regelefterlevnaden, bland annat genom att stoppa oönskade transaktioner.
        - Samarbetade med datainsamlingsteamet kring spårning och analys av betalflöden (cirka 30 MEUR per månad).
        - Deltog i hela kedjan från analys och implementation till kodgranskning, driftsättning och övervakning, och föreslog förbättringar av driftsättningsprocessen. Medverkade i rekryteringsintervjuer.

        **Teknik:** Kotlin, mikrotjänster, MySQL, Liquibase, Kubernetes, Marathon, Google Cloud, Datadog och ELK.<br />
        **Team:** 3–5 personer i strömmen, 30+ i det utökade teamet.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, distans
      summary: Digitaliserade manuella arbetssätt inom risk- och kreditgranskning.
      details: |
        - Digitaliserade granskningen av misstänkta transaktioner: ersatte Excel-baserat manuellt arbete med en webbapplikation, vilket förbättrade kvalitet och effektivitet i riskbedömningen.
        - Byggde ett verktyg som automatiserade övervakning och driftsättning av 20+ Blaze-instanser och förenklade releasearbetet under högsäsong.
        - Införde SSO (Waffle) för enklare inloggning, högre säkerhet och rätt behörigheter för olika användargrupper.
        - Implementerade Blaze FICO-regler i arbetet med att minska risken vid kunders låneansökningar.

        **Teknik:** Angular, Groovy, MongoDB, GitLab CI/CD, Artifactory och Pivotal Cloud Foundry.

    - role: Senior systemutvecklare / teamlead och lösningsarkitekt
      show: True
      time: 2015/03 - 2018/03
      company: UniCredit Services, Bukarest
      summary: Teamlead och lösningsarkitekt, applikationsövertagande och modernisering av prismotorer.
      details: |
        - **Fund Transfer Price:** Teamlead och lösningsarkitekt för tre utvecklare. Analyserade krav, utvärderade alternativ och tog fram lösningsarkitektur och POC, med hänsyn till verksamhetens behov och teamets kompetens.
        - **BUL-CT1:** Ansvarade för övertagandet av applikationen från en annan avdelning och samordnade överföringen av teknisk kunskap, rutiner och operativt ansvar.
        - **BUL-batchplattformen:** Migrerade till ny serverinfrastruktur i nära samarbete med plattforms- och CI/CD-teamen. Migreringen tog bort beroendet till Tibco GRID och minskade kostnaderna med flera hundratusen dollar per år.
        - **Global Pricing Tool:** Bidrog till moderniseringen från Java-monolit till mikrotjänster. Ledde dialogen med intressenter kring prestanda och förklarade för kunden hur precisionen i beräkningarna förbättrats.

    - role: Javautvecklare
      show: False
      time: 2011/10 - 2015/03
      company: Intuitext/Softwin, Bukarest
      summary: Lär- och utvärderingsplattformar för skolor, yrkesverksamma och banker, bl.a. en nationell utvärderingsplattform för gymnasieelever.

    - role: Javautvecklare
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bukarest
      summary: Applikation för fastighets- och ägarundersökningar med integrationer mot externa webbplatser.

    - role: Fullstack-Javautvecklare
      show: False
      time: 2005/04 - 2009/03
      company: Concept Data, Genesys och INGENIO-UCS, Bukarest
      summary: Projekthanterings-, intranät- och bankapplikationer, bl.a. kreditbedömning och låneberäkning.


