career-profile:
  title: Karriärprofil
  summary: |
    Jag är en bred och verksamhetsnära programvaruutvecklare i Kalmar med över 20 års erfarenhet av att bygga, vidareutveckla och integrera affärskritiska system. Jag arbetar genom hela utvecklingskedjan – från behovsanalys, datamodellering och backend till API:er, frontend, testning och driftsättning.

    På Tietoevry har jag bland annat arbetat med fullstackutveckling i TypeScript, NestJS och Angular, byggt integrationer mot Upsales samt utvecklat datadrivna rapport- och enkätlösningar med PostgreSQL, Neo4j, Kotlin och AWS. Tidigare har jag utvecklat betalningsintegrationer, interna verktyg, automationer och system för risk- och bedrägerihantering.

    Jag tycker om att arbeta nära användarna, förstå behovet bakom en beställning och omvandla löst formulerade problem till användbara och hållbara lösningar. Jag kan diskutera tekniska detaljer med utvecklare och samtidigt förklara lösningen för verksamheten.

    AI är en naturlig del av mitt utvecklingsarbete. Jag använder AI för att analysera alternativ, utveckla tester, förbättra algoritmer och refaktorera kod, samtidigt som jag själv ansvarar för behovsanalys, arkitektur, kvalitet, kundkommunikation och slutresultat. Jag har även arbetat med en AI-baserad Application Modernization-prototyp med Python, LangChain, LangGraph, Chainlit och Elasticsearch och är certifierad Azure AI Engineer Associate.

