experiences:
  title: Erfarenheter
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sverige
      summary: Backendutveckling i Java/Quarkus och Spring Boot för samhällskritiska kommunikationsflöden (SOS-VIDEO till 112), integrationer på AWS samt en LLM-baserad agentprototyp.
      details: |
        - **SOS-VIDEO till 112:** Bidrog till backendutveckling, integration och kvalitetssäkring av flödet för videosamtal till 112 med Quarkus-applikationer ovanpå Janus och en intern SIP-stack – ett samhällskritiskt system med höga krav på stabilitet. Driftsättningspipelinen automatiserades med GitLab CI/CD och Docker.
        - **AI Application Modernization POC:** Deltog i utvecklingen av en LLM-baserad agentprototyp med Python, LangChain, LangGraph, Chainlit och Elasticsearch som samlar in och analyserar projektdata för att föreslå förbättringar och modernisering av befintliga system. Paketerat med Docker Compose.
        - **RSS (AWS):** Arbetade med backendfunktionalitet för databastrensning och en API-integration mot CRM-systemet Upsales i en handelsapplikation på AWS (NestJS/Node.js, GraphQL, Neo4j).
        - **Friends MDT:** Bidrog till backendutveckling och datamodellering för ett digitalt enkät- och rapportsystem med Spring Boot, Kotlin, JPA och PostgreSQL, driftsatt på AWS.
        - **Driftorder:** Arbetade med en demoapplikation med Spring Boot och Flowable (BPMN) och utvecklade integrationen mot Form.io för kunddialoger.

        **Teknikstack:** Java, Quarkus, Spring Boot, Kotlin, JPA, PostgreSQL, Neo4j, NestJS/Node.js, GraphQL, Python, LangChain, LangGraph, Elasticsearch, AWS, GitLab CI/CD, Docker, TypeScript och Angular.

    - role: Systemutvecklare, Payments
      time: 2021/05 - 2023/05
      show: True
      company: LeoVegas, Remote-Sverige
      summary: Bidrog till betalningsintegrationer och en regelmotor för bedrägeribekämpning i Kotlin/JVM-mikrotjänster på Kubernetes i Google Cloud.
      details: |
        - Bidrog som medlem i kortbetalningsteamet till två kortbetalningsintegrationer (bl.a. Adyen) och en regelmotor för val av betalningsleverantör samt risk- och bedrägeribekämpning. Teamets mål var att sänka transaktionskostnaderna, utöka betalningsalternativen och minska risken för betalningsbedrägerier.
        - Arbetade i en distribuerad mikrotjänstarkitektur som hanterade betalflöden på cirka 30 MEUR per månad; samarbetade med datainsamlingsteamet för att lagra och förmedla de fält som behövdes för deras datainsamling.
        - Deltog i hela kedjan: analys, implementation, kodgranskning (PR reviews), CI/CD-driftsättning och övervakning av mikrotjänster i Marathon och Kubernetes på Google Cloud. Felsökte med Datadog och ELK och föreslog förbättringar av driftsättningsprocessen. Deltog även i tekniska intervjuer vid rekrytering av utvecklare.

        **Teknikstack:** Kotlin, Spring Boot-liknande internt ramverk, REST, mikrotjänster, JPA, MySQL, Liquibase, Docker, Kubernetes, Marathon, Google Cloud, Datadog och ELK-stacken.<br />
        **Teamet:** 3–5 teammedlemmar, 30+ i det utökade teamet.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Rumänien
      summary: Bidrog till utveckling av backend- och automationsverktyg för riskbedömning, testautomatisering och CI/CD inom finans.
      details: |
        - Bidrog till ett verktyg som automatiserade övervakning och driftsättning av 20+ Blaze-instanser via CI/CD med GitLab, Artifactory och Pivotal Cloud Foundry – förenklade releaser och övervakning under högsäsong.
        - Skrev om och förbättrade ett automatiserat testramverk så att utvecklare kunde verifiera kod och systemflöden mot förväntade utfall och upptäcka regressioner tidigare.
        - Deltog i utvecklingen av en applikation för granskning och verifiering av misstänkta transaktioner som ersatte manuellt arbete i Excel och förbättrade kvaliteten i riskbedömningen.
        - Integrerade SSO med Waffle för säkrare inloggning och korrekt behörighetsstyrning.
        - Implementerade Blaze FICO-regler för att minska risken vid kunders låneansökningar.

        **Teknikstack:** Groovy (JVM), Servlets, Akka, MongoDB, Angular, GitLab CI/CD, Artifactory och Pivotal Cloud Foundry.

    - role: Senior systemutvecklare
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bukarest
      summary: Bidrog till modernisering av pris- och batchplattformar och agerade teamlead och arkitekt för en konceptstudie med Spring Boot/Spring Batch.
      details: |
        - Bidrog till moderniseringen av GPT (Global Pricing Tool) när det byggdes om från Java-monolit till mikrotjänster i Scala, Python (beräkningsmotor), Hazelcast (cache) och Angular, distribuerat på Docker. I GPT-projektet användes även Mesos och Jenkins.
        - Arbetade tillsammans med teamet med införandet av enhetstester under ombyggnaden och deltog i dialoger med intressenter kring prestanda och den förbättrade precisionen när BigDecimal ersatte Float.
        - Agerade **teamlead och arkitekt** för tre utvecklare i Fund Transfer Price-initiativet: utvärderade teknik och tog fram en POC med Spring Boot, Spring Batch, MyBatis och Vaadin ovanpå befintlig Teradata. Arbetet omfattade även CI/CD med Jenkins.
        - Bidrog till migreringen av BUL-batchplattformen (EJB, JMS) till nya WebSphere-servrar och integrationen med CI/CD-verktyget Gandalf, i samarbete med infrastruktur- och CI/CD-teamen.

        **Teknikstack:** Java, Spring Boot, Spring Batch, MyBatis, EJB, JMS, Scala, Python, Hazelcast, Teradata, Jenkins, Docker och Mesos.

    - role: Javautvecklare
      time: 2011/10 - 2015/03
      show: True
      company: Intuitext/Softwin, Bukarest
      summary: Utvecklade Java-baserade webbapplikationer och lärplattformar med Spring, Hibernate, PostgreSQL och MySQL.
      details: |
        Arbetade med utveckling och underhåll av LMS-, LCMS- och utvärderingsplattformar för skolor, yrkesverksamma och banker – datamodellering, persistenslager och webbapplikationer.<br />
        **Teknikstack:** Java, Spring, Spring MVC, Hibernate, Struts, JSP, PostgreSQL, MySQL, Maven, Tomcat och JBoss.

    - role: Javautvecklare
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bukarest
      summary: Utvecklade integrationer i Java mot externa webbplatser (HTTP Client, HTML-parsning, XML) med persistens i MySQL.

    - role: Fullstack-Javautvecklare
      time: 2007/06 - 2009/03
      show: False
      company: Concept Data, Bukarest
      summary: Bidrog till utvecklingen av en Java-baserad projekthanteringsplattform (TasKAFE) med Spring, Hibernate, Oracle och PostgreSQL.

    - role: Javautvecklare
      time: 2005/04 - 2007/06
      show: False
      company: Genesys och INGENIO-UCS, Bukarest
      summary: Java-baserade intranät- och bankapplikationer med Struts, JSF, JSP och Servlets; JDBC, SQL och stored procedures mot Oracle och SQL Server.


