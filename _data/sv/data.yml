experiences:
    title: Erfarenheter
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sverige
        details: |
          **SOS-VIDEO till 112** - Syftet med projektet är att lägga till video till ett befintligt nödsamtal till 112 genom att skicka ett 
          SMS-meddelande med en länk som den hjälpsökande ska öppna för att upprätta en videoförbindelse med operatören som hanterar samtalet.
          Detta uppnås genom att använda en öppen källkodsstack med Janus som videoserver, en internt inbyggd SIP-stack samt två Quarkus-applikationer 
          som sitter högst upp i flödet.
          Jag arbetade med Javautveckling, integrationer och kvalitetssäkring av de sammanhängande kommunikationsflödena.
          Distributionspipelinen automatiserades med GitLab, Ansible och Docker i en lokal driftmiljö.
          <br /><br />
          **Driftorder Demo Application** - En demonstrationsapplikation för Driftorder BPMN-processen byggd med Spring Boot och Flowable.
          Jag byggde integration till Form.io.
          <br /><br />
          **AI Application Modernization POC** – är an AI-app för att hjälpa utvecklare för att 
          samla projektdata, erbjuda lösningar för förbättring och modernisering.
          Det var första kontakten med ett AI-projekt och jag fick praktisk erfarenhet med verktyg som
          Chainlit, LangGraph, LangChain, Elasticsearch samt uppfräschning av
          Docker Compose och Python.
          <br /><br />
          **RSS** – Fullstack-utveckling för en applikation på AWS som stödjer ett företag
          som gör kommersiell handel för småelektronik. Jag var ansvarig för utveckling, underhåll och integration med 
          ett annat system, Upsales.          
          **Teknikstack:**  Neo4j med Cypher, Typescript med NestJS och Angular, GraphQL och AWS.
          <br /><br />
          **Friends MDT** – Utveckling av digitala enkätverktyg för Friends-stiftelsen i deras arbete mot mobbning och trakasserier.
          Applikationen användes för insamling av data från skolor genom att genomföra enkäter med syfte att visualisera
          och analysera resultaten.
          Efter insamlingen genererades en komplex rapport baserad på forskning som visar barnens välmående i skolan.
          Applikationen använde PostgreSQL, Neo4j, JPA, Spring Boot med Java och Kotlin samt Angular och distribuerades via AWS.
          I den första fasen använde vi VMware Tanzu för CI/CD.
      - role: Programvaruutvecklare @Payments
        time: 2021/05 - 2023/05
        show: True
        company: Leovegas, Remote-Sverige
        details: |
          Teamet i betalningsavdelningen bygger och underhåller betalningsintegrationer 
          mellan våra kärnsystem och olika betalningsleverantörer och betalningsmetoder 
          vilket möjliggör för spelaren att sätta in och ta ut pengar på ett smidigt sätt. 
          Min roll låg inom kortströmmen som specifikt hanterar kortbetalningsintegrationer. 
          Vårt mål är att sänka kostnaden per betalning, utöka våra nuvarande betalningsmetoder 
          och minska risken för bedrägerier vid betalningar. 
          Som medlem i kortströmmen var jag involverad i att bygga en av våra integrationer 
          och regelmotorn som används för att skapa regler för risk- och bedrägeribekämpning.
          **Teknikstack:** En mikrotjänstarkitektur byggd med Java och Kotlin ovanpå ett internt Spring Boot-liknande ramverk,
          med JPA för persistens och MySQL som databas. Vi distribuerade våra mikrotjänster i Google Cloud och
          vi använde oss av Kubernetes för containerplattform.<br />
          **Teamet**: 3–5 strömsmedlemmar, 30+ utökat team

      - role: Principal Programvaruingenjör
        show: True
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Rumänien
        details: |
          Vårt avdelningsmål är att minska risken när ett lån begärs av en kund.
          Jag var involverad i att bygga verktyg som hjälper till att automatisera vissa uppgifter i vår avdelning.
          <br />
          Byggde en webbapp som automatiserade övervakning och distribution av våra 20+ Blaze-inställningar. I det här projektet
          byggde vi bland annat en CI/CD pipeline med GitLab, Artifactory och Pivotal Cloud Foundry. Denna app ökade nöjdheten 
          hos våra kollegor som ansvarar för att släppa nya versioner och underlättade övervakningen
          av våra instanser under högsäsong. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB.          
          <br />
          Jag var involverad i att skapa en webbapp som hjälper våra kollegor att granska och verifiera misstänkta 
          transaktioner. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB. Jag skrev om och förbättrade 
          ett befintligt automatiserat testramverk som gjorde det möjligt för utvecklarna att verifiera kod och systemflöden mot
          förväntade utfall och upptäcka regressioner tidigare i utvecklingsprocessen.
          Lyckades även integrera SSO-funktionalitet i våra webbappar med hjälp av Waffle.          
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.          
          **Teknikstack:**  Groovy, MongoDB, Akka, Angular.          
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.

      - role: Senior Programvaruutvecklare
        time: 2015/03 - 2018/03
        show: True
        company: UniCredit Services, Bukarest
        details: |
         Jag arbetade med olika "prismotorer" för våra Unicredit-kollegor från Italien.           
         <br />
         **GPT (Global Pricing Tool)**  Vi byggde om den här projekt från en monolit byggd på en Java-teknikstack 
         till en mikrotjänstinfrastruktur med Scala för mikrotjänsterna, Python för 
         beräkningsmotorn, Hazelcast för cachelagring av data och Angular för frontend. Vi använde även SBT 
         för att bygga Scala-mikrotjänsterna. Vi strävade efter att ge användarna en mer behaglig upplevelse 
         och lyckades med det genom att öka webbappens hastighet och motståndskraft. Mikrotjänsterna 
         distribuerades slutligen på Docker.
         **Teamet**  för detta projekt bestod av en teknisk analytiker, affärsanalytiker och sex utvecklare. 
         Vi arbetade enligt agil metodik.          
         <br />
         **BUL-Batch-plattform/beräkningsmotor**  I 4 månader bidrog jag till migreringen av en viktig applikationill en ny serverinfrastruktur. En viktig del av arbetet var att integrera applikationen i företagets servrar 
         och CI/CD-pipelines. Detta innebar samarbete med teamet  som ansvarade för WebSphere-servrarna samt teamet  som 
         hanterade CI/CD-verktyget (Gandalf), eftersom vissa inställningar inte kunde göras av mig själv.
         Teknikstacken innehöll EJB2.0, JMS, WebSphere 5 och 8.          
         <br />
         **Fund Transfer Price** Jag byggde en POC för  Fund Transfer Price plattformen - Batch-plattform/beräkningsmotor med en öppen källkodsstack: 
         Spring Batch, Spring Boot, MyBatis, Vaadin, men använde den tidigare Teradata-databasen.Vi byggde vår CI/CD med Jenkins och använde Docker för moduler.           
         **Ledarskap:** Jag agerade som teamlead och arkitekt och ansvarade för tre andra utvecklare. Jag gav teknisk vägledning, samordnade utvecklingsarbetet och drev arkitekturella beslut tillsammans med teamet.
         
#         Hade även en mindre roll i Exonus-projektet som byggdes med Spring Cloud-infrastruktur.

      - role: Javautvecklare
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bukarest
        details: |
          Jag arbetade med olika projekt inom eLearning-området. Projekten jag arbetade med var LMS (Learning 
          Management Systems)/LCMS (Learning Content Management Systems). Deras syfte var att hjälpa studenter och 
          yrkesverksamma att förvärva ny kunskap och färdigheter inom vissa områden. Plattformarna stödde att gå 
          igenom onlinekurser, mäta framsteg och bedöma kunskap. Jag arbetade med flera olika teknikstackar:
            - Hibernate, Spring, Struts 1, MySQL, BIRT och Tomcat
            - Hibernate, Spring, Spring MVC, MySQL, JSP, jQuery och Tomcat
            - Struts, Hibernate, MySQL och JBoss
            - Jira för hantering av arbetsuppgifter och felrapporter

          Vi arbetade enligt vattenfallsmetoden, vanligtvis med två till fyra utvecklare per projekt. Arbetet följdes
          upp av en teamchef och en projektledare, och QA-avdelningen ansvarade för kvalitetssäkring och testning.

      - role: Fullstack Javautvecklare
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bukarest
        details: |
          Jag utvecklade och förvaltade applikationen Title Search genom att integrera nya webbplatser med hjälp av
          HttpClient API, HTML Parser API, reguljära uttryck och XML. Informationen som hämtades från webbplatserna
          sparades i applikationens MySQL-databas för senare användning.

          Syftet med applikationen var att samla tillgänglig information om fastigheter och fastighetssäljare och
          därigenom minska köparens risker vid fastighetsaffärer.

          Teknikstack: GWT, Servlets, MySQL och Resin.
          Teamet bestod av åtta utvecklare, tre testare och en utvecklingsledare.

      - role: Fullstack Javautvecklare
        time: 2007/06 - 2009/03
        company: Concept Data, Bukarest
        details: |
          Vi utvecklade ett system för uppgiftshantering med Hibernate, Swing, ett antal Java-API:er samt den
          inbäddade servern Jetty och en PostgreSQL-databas. Jag ansvarade bland annat för att utveckla rapportverktyg
          som användes i kommunikationen med rumänska myndigheter.

          Jag deltog även i utvecklingen av en flexibel rapportmodul genom att utöka funktionaliteten i JasperReports.

          Teknikstack: Java, Hibernate, Swing, iText, JasperReports, JFreeChart, Jetty och PostgreSQL.
          Verktyg: Eclipse.

      - role: Fullstack Javautvecklare
        time: 2007/02 - 2007/06
        company: Genesys, Bukarest
        details: |
          Företaget utvecklade ett webbaserat CRM-system med JSF och Ajax samt ett administrationsverktyg byggt med
          SWT. Webbklienten och administrationsverktyget var anslutna till en SQL Server-databas. Jag implementerade
          bland annat funktionalitet i systemets trädmeny.

          Jag byggde även om en webbaserad ärendehanteringsapplikation för registrering och hantering av klagomål
          rörande gatubelysning.

          Teknik och verktyg: JSF, Ajax, SWT, SQL Server, Eclipse och TOAD.

      - role: Fullstack Javautvecklare
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bukarest
        details: |
          Företaget utvecklade finansiella webbapplikationer med J2EE-teknik för stora kunder i Rumänien. Jag arbetade
          med en prescoring-applikation för en större rumänsk bank. Systemet utvecklades med Struts, Java, Oracle
          Database och PL/SQL.

          Projektet var omfattande och hade höga krav från kunden. Vid ett tillfälle behövde jag ändra centrala delar
          av applikationen och genomförde arbetet inom en snäv tidsfrist. Eftersom systemet hade många användarkategorier
          fick jag ansvar för att designa och implementera administrationen av användare och roller. Lösningen utformades
          med inspiration från Unix principer för IP-filtrering och utan märkbar negativ påverkan på prestandan.

          Teknikstack: Oracle Database, PL/SQL, Java, Servlets, JSP och Struts.
          Verktyg: Eclipse och TOAD.

