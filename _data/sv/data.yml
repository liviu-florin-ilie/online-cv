career-profile:
  title: Karriärprofil
  summary: |
    Senior fullstackutvecklare med mer än 20 års erfarenhet av verksamhetskritiska system i tvärfunktionella och agila team. Min starkaste grund är Java och JVM-ekosystemet (Quarkus, Spring Boot, Kotlin, JPA/Hibernate och PostgreSQL). Jag har flerårig frontenderfarenhet av TypeScript och Angular samt containerbaserad driftsättning med Docker och Kubernetes. Jag har byggt produktionssystem för bland annat nödtjänster, finans, betalningar, e-lärande och projekthantering.

    Jag lever efter devisen "gör vad du kan, med det du har, där du är", vilket har gjort att jag fungerar i olika företagskulturer, teamupplägg och teknikstackar. Jag delar gärna med mig av kunskap, tar gemensamt ansvar för kvaliteten och går in i de roller som behövs, från felsökare när något "brinner" till arkitekt och byggare.

    Bosatt i Kalmar och tillgänglig för tillträde snarast.

