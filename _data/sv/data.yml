career-profile:
  title: Karriärprofil
  summary: |
    Jag har över 20 års erfarenhet av att utveckla, integrera och förvalta verksamhetskritiska IT-system. Med åren har tyngdpunkten flyttats från enskilda lösningar till helheten: att förstå verksamhetens behov, väga tekniska alternativ och göra avvägningarna begripliga för både verksamhet och teknik.

    Min närmaste erfarenhet av vårdnära och samhällsviktig IT kommer från Tietoevry, där jag arbetade med **SOS-VIDEO till 112** för SOS Alarm – en lösning där den hjälpsökande kan dela video med operatören under ett pågående nödsamtal. Där är tillgänglighet, säkerhet, tydliga rutiner och samverkan mellan flera aktörer en förutsättning. I **Friends MDT** var jag med och ersatte pappersenkäter med ett digitalt verktyg, där uppgifter om elevers välmående omsattes i forskningsbaserade rapporter som beslutsunderlag för skolor.

    Samverkan är en röd tråd i min karriär. På UniCredit samordnade jag övertagandet av en verksamhetskritisk applikation från en annan avdelning – kunskap, rutiner och operativt ansvar – och var teamlead och lösningsarkitekt för en ny Fund Transfer Price-plattform. Inom finans och spel (Dell Financial Services, LeoVegas) har jag arbetat i reglerade miljöer där regelefterlevnad och riskhantering är en del av varje beslut.

    Jag trivs i roller med många samverkansytor. Jag lyssnar in hur verksamheten faktiskt arbetar, planerar och prioriterar strukturerat och dokumenterar beslut och resonemang (bl.a. med ADR:er) så att de håller över tid. Jag föredrar enkla, beprövade lösningar framför onödig komplexitet.

    Bosatt i Kalmar sedan 2020 och tillgänglig för tillträde snarast.

