experiences:
  title: Erfarenheter
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sverige
      summary: Backendutveckling i Java/Quarkus och Spring Boot för samhällskritiska kommunikationsflöden (SOS-VIDEO till 112), integrationer på AWS samt en LLM-baserad agentprototyp.
      details: |
        - **SOS-VIDEO till 112:** Utvecklade, integrerade och kvalitetssäkrade backendflödet för videosamtal till 112 med Quarkus-applikationer ovanpå Janus och en intern SIP-stack – ett samhällskritiskt system med höga krav på stabilitet. Automatiserade driftsättningspipelinen med GitLab CI/CD, Ansible och Docker.
        - **AI Application Modernization POC:** Byggde en LLM-baserad agentprototyp med Python, LangChain, LangGraph, Chainlit och Elasticsearch som samlar in och analyserar projektdata för att föreslå förbättringar och modernisering av befintliga system. Paketerat med Docker Compose.
        - **RSS (AWS):** Utvecklade backendfunktionalitet för databastrensning och en API-integration mot CRM-systemet Upsales i en handelsapplikation på AWS (NestJS/Node.js, GraphQL, Neo4j).
        - **Friends MDT:** Byggde backend och datamodell för ett digitalt enkät- och rapportsystem med Spring Boot, Kotlin, JPA och PostgreSQL, driftsatt på AWS.
        - **Driftorder:** Tog fram en demoapplikation med Spring Boot och Flowable (BPMN) inklusive integration mot Form.io för kunddialoger.

        **Teknikstack:** Java, Quarkus, Spring Boot, Kotlin, JPA, PostgreSQL, Neo4j, NestJS/Node.js, GraphQL, Python, LangChain, LangGraph, Elasticsearch, AWS, GitLab CI/CD, Ansible, Docker, TypeScript och Angular.

    - role: Systemutvecklare, Payments
      time: 2021/05 - 2023/05
      show: True
      company: LeoVegas, Remote-Sverige
      summary: Utvecklade betalningsintegrationer och en regelmotor för bedrägeribekämpning i Kotlin/JVM-mikrotjänster på Kubernetes i Google Cloud.
      details: |
        - Byggde två kortbetalningsintegrationer (bl.a. Adyen och PCI Proxy) och en regelmotor som valde betalningsleverantör per marknad – sänkte transaktionskostnaderna, stärkte säkerheten och regelefterlevnaden genom att stoppa oönskade och misstänkta transaktioner.
        - Arbetade i en distribuerad mikrotjänstarkitektur som hanterade betalflöden på cirka 30 MEUR per månad; vidareutvecklade datalagret med SQL/Liquibase och JPA-entiteter tillsammans med datainsamlingsteamet.
        - Deltog i hela kedjan: analys, implementation, kodgranskning (PR reviews), CI/CD-driftsättning och övervakning av mikrotjänster i Marathon och Kubernetes på Google Cloud. Felsökte med Datadog och ELK och föreslog förbättringar av driftsättningsprocessen. Deltog även i tekniska intervjuer vid rekrytering av utvecklare.

        **Teknikstack:** Kotlin, Spring Boot-liknande internt ramverk, REST, mikrotjänster, JPA, MySQL, Liquibase, Docker, Kubernetes, Marathon, Google Cloud, Datadog och ELK-stacken.<br />
        **Teamet:** 3–5 teammedlemmar, 30+ i det utökade teamet.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Rumänien
      summary: Utvecklade backend- och automationsverktyg för riskbedömning, testautomatisering och CI/CD inom finans.
      details: |
        - Byggde ett verktyg som automatiserade övervakning och driftsättning av 20+ Blaze-instanser via CI/CD med GitLab, Artifactory och Pivotal Cloud Foundry – förenklade releaser och övervakning under högsäsong.
        - Skrev om och förbättrade ett automatiserat testramverk så att utvecklare kunde verifiera kod och systemflöden mot förväntade utfall och upptäcka regressioner tidigare.
        - Utvecklade en applikation för granskning och verifiering av misstänkta transaktioner som ersatte manuellt arbete i Excel och förbättrade kvaliteten i riskbedömningen.
        - Integrerade SSO med Waffle för säkrare inloggning och korrekt behörighetsstyrning – tog över uppgiften när en kollega inte kom vidare.
        - Implementerade Blaze FICO-regler för att minska risken vid kunders låneansökningar.

        **Teknikstack:** Groovy (JVM), Servlets, Akka, MongoDB, Angular, GitLab CI/CD, Artifactory och Pivotal Cloud Foundry.

    - role: Senior systemutvecklare
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bukarest
      summary: Moderniserade Java-monoliter till mikrotjänster och ledde arkitekturen för en Spring Boot/Spring Batch-plattform på Docker.
      details: |
        - Bidrog i kritiska delar av GPT (Global Pricing Tool) när det byggdes om från Java-monolit till mikrotjänster i Scala, Python (beräkningsmotor), Hazelcast (cache) och Angular, distribuerat på Docker.
        - Drev införandet av enhetstester för att höja kodkvaliteten under ombyggnaden, och ledde dialoger med intressenter kring prestanda och den förbättrade precisionen när BigDecimal ersatte Float.
        - Agerade **teamlead och arkitekt** för tre utvecklare i Fund Transfer Price-initiativet: designade en ny plattform med Spring Boot, Spring Batch, MyBatis och Vaadin ovanpå befintlig Teradata, byggde CI/CD med Jenkins och driftsatte Docker-moduler på Mesos/Marathon.
        - Migrerade BUL-batchplattformen (EJB, JMS) till nya WebSphere-servrar och CI/CD-verktyget Gandalf, vilket tog bort ett beroende till Tibco GRID och sparade flera hundratusen dollar per år.

        **Teknikstack:** Java, Spring Boot, Spring Batch, MyBatis, EJB, JMS, Scala, Python, Hazelcast, Teradata, Jenkins, Docker och Mesos/Marathon.

    - role: Javautvecklare
      time: 2011/10 - 2015/03
      show: True
      company: Intuitext/Softwin, Bukarest
      summary: Utvecklade Java-baserade webbapplikationer och lärplattformar med Spring, Hibernate, PostgreSQL och MySQL.
      details: |
        Utvecklade och underhöll LMS-, LCMS- och utvärderingsplattformar för skolor, yrkesverksamma och banker – datamodellering, persistenslager och webbapplikationer.<br />
        **Teknikstack:** Java, Spring, Spring MVC, Hibernate, Struts, JSP, PostgreSQL, MySQL, Maven, Tomcat och JBoss.

    - role: Javautvecklare
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bukarest
      summary: Utvecklade integrationer i Java mot externa webbplatser (HTTP Client, HTML-parsning, XML) med persistens i MySQL.

    - role: Fullstack-Javautvecklare
      time: 2007/06 - 2009/03
      show: False
      company: Concept Data, Bukarest
      summary: Utvecklade en Java-baserad projekthanteringsplattform (TasKAFE) med Spring, Hibernate, Oracle och PostgreSQL.

    - role: Javautvecklare
      time: 2005/04 - 2007/06
      show: False
      company: Genesys och INGENIO-UCS, Bukarest
      summary: Java-baserade intranät- och bankapplikationer med Struts, JSF, JSP och Servlets; JDBC, SQL och stored procedures mot Oracle och SQL Server.


