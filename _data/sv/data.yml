career-profile:
  title: Karriärprofil
  summary: |
    **Senior fullstackutvecklare med över 20 års erfarenhet** av affärskritiska system, varav över tio år med Java/J2EE.
    Jag vill bidra till Fortnox team Kronos med **Java, Kotlin, Spring Boot, mikrotjänster och SQL**, erfarenhet av betalningar och ett verksamhetsnära arbetssätt.

    På LeoVegas utvecklade jag betalningsintegrationer med Kotlin. På Tietoevry arbetade jag med Spring Boot, Kotlin, PostgreSQL, TypeScript och Angular samt en **AI-baserad POC för applikationsmodernisering**.
    På UniCredit moderniserade jag prisplattformar och ledde en POC med Spring Boot och Spring Batch.

    För mig innebär utvecklarrollen att vara **detektiv, arkeolog, byggare och arkitekt**.
    Jag söker ledtrådar i verksamhetens behov, undersöker lager av kod och tidigare beslut, bygger fungerande lösningar och väger tekniska alternativ för att skapa en hållbar riktning.
    Som **översättare** gör jag tekniska avvägningar begripliga och skapar gemensam förståelse i teamet, nära implementationen.
    Baserad i Kalmar med professionella kunskaper i svenska och engelska.

