career-profile:
  title: Karriärprofil
  summary: |
    Senior backendutvecklare med över 20 års erfarenhet av affärskritiska system, varav över tio år med Java/J2EE och därefter modern JVM-utveckling med **Java, Spring Boot, Quarkus och Kotlin**. Jag har byggt **REST API:er, integrationer och mikrotjänster** inom bland annat nödtjänster (SOS-VIDEO till 112), betalningar, finans och e-lärande, och tagit lösningar hela vägen från idé och datamodell till produktion och drift.

    Jag har arbetat med containerbaserade och molnbaserade miljöer (**Docker, Kubernetes, Google Cloud, AWS**), CI/CD med GitLab och Jenkins, SQL- och NoSQL-databaser samt övervakning med Datadog och ELK. Kvalitet, säkerhet och skalbarhet har varit centrala delar av arbetet: kodgranskning, automatiserad testning, SSO, regler för bedrägeribekämpning och prestandaoptimering. Som teamlead och arkitekt har jag drivit tekniska vägval, coachat utvecklare och deltagit i rekrytering.

    **AI är en naturlig del av mitt utvecklingsarbete.** Jag använder AI-verktyg som Codex, GitHub Copilot och IntelliJ AI för att analysera stora kodbaser, ta fram tester, felsöka, refaktorera och dokumentera – med eget ansvar för granskning och kvalitet. På Tietoevry byggde jag en LLM-baserad agentprototyp för applikationsmodernisering med Python, LangChain, LangGraph och Elasticsearch, och jag är certifierad **Microsoft Azure AI Engineer Associate (AI-102)**.

    Jag lever efter devisen "gör vad du kan, med det du har, där du är" och trivs i tekniskt utmanande konsultuppdrag tillsammans med andra erfarna utvecklare. Bosatt i Kalmar och tillgänglig för tillträde snarast.

