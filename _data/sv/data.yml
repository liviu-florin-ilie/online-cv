career-profile:
  title: Karriärprofil
  summary: |
    Jag har över 20 års erfarenhet av att utveckla, integrera och förvalta verksamhetskritiska IT-system. Jag har även haft uppdrag som teamlead och lösningsarkitekt. Min styrka är att förstå verksamhetens behov, tydliggöra beroenden och göra tekniska avvägningar begripliga för olika intressenter.

    På Tietoevry arbetade jag med **SOS-VIDEO till 112 för SOS Alarm** och digitala beslutsunderlag för Friends. På UniCredit samordnade jag ett applikationsövertagande mellan avdelningar och arbetade med lösningsarkitektur och modernisering. Jag har också utvecklat betalnings- och risklösningar i reglerade verksamheter.

    Jag vill bidra med teknisk förståelse, strukturerat arbetssätt och erfarenhet av samverkan i Region Kalmar läns arbete med e-Hälsa. Bosatt i Kalmar sedan 2020 och tillgänglig för tillträde snarast.

