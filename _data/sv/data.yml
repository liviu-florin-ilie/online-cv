career-profile:
  title: Karriärprofil
  summary: |  
    Jag är en erfaren programvaruutvecklare med 20+ års erfarenhet och lever efter mottot: "Gör vad du kan, med vad du har, där du är".
    Under mina första tio år arbetade jag huvudsakligen med Java och J2EE. Därefter började jag arbeta mer med fullstackutveckling och TypeScript/Angular,
    bland annat hos UniCredit. Jag har sedan dess arbetat med Angular i flera projekt, bland annat inom Tietoevry i både Friends- och RSS-projekten samt i flera projekt hos Dell.
    Jag har lång erfarenhet av testning och har använt olika testbibliotek och teststrategier inom Java-utveckling. Den erfarenheten ger mig en god grund för att arbeta med
    testning av moderna webbapplikationer, inklusive komponent-, integrations- och API-tester. På LeoVegas arbetade jag med klientdelen av betalningsintegrationer mot bland annat PCI Proxy och Adyen.
    Jag har även arbetat med flera integrationslösningar inom betalningsområdet samt med integrationen mellan RSS-applikationen och Upsales.
    Detta har gett mig bred praktisk erfarenhet av att utveckla och felsöka integrationer mellan interna och externa system. Jag har erfarenhet av både GCP- och AWS-baserade miljöer. På LeoVegas arbetade
    vi med GCP som molnplattform, medan jag på Tietoevry har arbetat med AWS-baserade lösningar.
    På Advantage Title Solutions arbetade jag med datainsamling från både offentliga och icke-offentliga datakällor. Syftet var att samla och bearbeta information som användes
    för att säkerställa att en fastighetsaffär kunde genomföras utan problem. Detta gav mig ytterligare erfarenhet av dataflöden, integrationer och hantering av stora mängder information.
    Min bakgrund inom Java, TypeScript, Angular, molnplattformar, integrationer, testning och produktionssatta system ger mig en bred teknisk grund och goda förutsättningar att snabbt sätta mig in i nya tekniker och arkitekturer.

