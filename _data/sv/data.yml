career-profile:
  title: Karriärprofil
  summary: |
    Jag är en senior backendutvecklare med över 20 års erfarenhet av affärskritiska system, varav över tio års direkt erfarenhet av Java/J2EE och fortsatt arbete inom JVM-ekosystemet med **Java, Spring Boot, Quarkus och Kotlin**. Min bakgrund omfattar **REST API:er, integrationer och mikrotjänster** inom kritisk kommunikation, betalningar, finans och e-lärande.

    Jag har arbetat med containerbaserade och molnbaserade miljöer (**Docker, Kubernetes, Google Cloud, AWS**), CI/CD med GitLab och Jenkins, SQL- och NoSQL-databaser samt övervakning med Datadog och ELK. Arbetet har omfattat kodgranskning, automatiserad testning, SSO, regler för bedrägeribekämpning och prestandaförbättringar, i samarbete med utvecklare och andra specialistteam.

    På UniCredit agerade jag som teamlead och lösningsarkitekt för tre utvecklare i en konceptstudie för Fund Transfer Price, där jag utvärderade teknik och bidrog till tekniska vägval. På Tietoevry arbetade jag med integrations- och kommunikationsflöden i SOS-VIDEO till 112 och deltog i utvecklingen av en LLM-baserad prototyp för applikationsmodernisering med Python, LangChain, LangGraph och Elasticsearch.

    Jag använder AI-verktyg som Codex, GitHub Copilot och IntelliJ AI som stöd för kodanalys, testning, felsökning, refaktorering och dokumentation, med granskning och kvalitetssäkring som en del av arbetet. Jag är certifierad **Microsoft Azure AI Engineer Associate (AI-102)**.

    Jag trivs med att diskutera tekniska alternativ, dela kunskap och hjälpa team att utveckla lösningar som är hållbara över tid. Bosatt i Kalmar och tillgänglig för tillträde snarast.

