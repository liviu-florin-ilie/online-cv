experiences:
    title: Erfarenheter
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sverige
        details: |
          **RSS** – Fullstackutveckling och vidareutveckling av ett affärssystem för handel med småelektronik. Jag arbetade med backend, frontend, datalager samt integrationen mot CRM-systemet Upsales.
          **Teknikstack:** TypeScript, NestJS, Angular, GraphQL, Neo4j/Cypher och AWS.

          **Friends MDT** – Utveckling av digitala enkätverktyg för Friends-stiftelsen i deras arbete mot mobbning och trakasserier.
          Applikationen användes för insamling av data från skolor genom att genomföra enkäter med syfte att visualisera
          och analysera resultaten.
          Efter insamlingen genererades en komplex rapport baserad på forskning som visar barnens välmående i skolan.
          **Teknikstack:** PostgreSQL, Neo4j, Kotlin, Spring Boot, Angular, AWS  (VMware Tanzu).

          **AI Application Modernization POC** – En AI-baserad prototyp för att samla in och analysera projektdata samt identifiera möjligheter till förbättring och modernisering. Arbetet omfattade LangChain, LangGraph, Chainlit och Elasticsearch samt praktiskt arbete med Python och Docker Compose.

          **SOS-VIDEO till 112** – Utveckling av en lösning där en SMS-länk upprättar en videoförbindelse mellan den hjälpsökande och larmoperatören under ett pågående nödsamtal. Lösningen använde Janus, en intern SIP-stack och två Quarkus-applikationer. Distributionspipelinen automatiserades med GitLab, Ansible och Docker.

          **Driftorder Demo Application** – Utveckling av integrationen mot Form.io i en demonstrationsapplikation för Driftorder BPMN-processen, byggd med Spring Boot och Flowable.

      - role: Programvaruutvecklare @Payments
        time: 2021/05 - 2023/05
        show: True
        company: Leovegas, Remote-Sverige
        details: |
          Teamet i betalningsavdelningen bygger och underhåller betalningsintegrationer 
          mellan våra kärnsystem och olika betalningsleverantörer och betalningsmetoder 
          vilket möjliggör för spelaren att sätta in och ta ut pengar på ett smidigt sätt. 
          Min roll låg inom kortströmmen som specifikt hanterar kortbetalningsintegrationer. 
          Vårt mål är att sänka kostnaden per betalning, utöka våra nuvarande betalningsmetoder 
          och minska risken för bedrägerier vid betalningar. 
          Som medlem i kortströmmen var jag involverad i att bygga en av våra integrationer 
          och regelmotorn som används för att skapa regler för risk- och bedrägeribekämpning.
          **Teknikstack:**  En mikrotjänstarkitektur byggd över ett internt Spring Boot-liknande ramverk 
          med Kotlin och MySQL som databas. Vi distribuerade våra mikrotjänster i Google Cloud och
          vi använde oss av Kubernetes för containerplattform.<br />
          **Teamet**: 3–5 strömsmedlemmar, 30+ utökat team

      - role: Principal Programvaruingenjör
        show: True
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Rumänien
        details: |
          Utvecklade interna webbverktyg för riskhantering och automatisering. Byggde en webbapp för övervakning och distribution av över 20 Blaze-installationer samt en CI/CD-pipeline med GitLab, Artifactory och Pivotal Cloud Foundry.

          Utvecklade även ett verktyg för granskning av misstänkta transaktioner, skrev om och förbättrade ett automatiserat testningsramverk samt integrerade SSO med Waffle.
          **Teknikstack:** Angular, Groovy, Servlets, MongoDB och Akka.

      - role: Senior Programvaruutvecklare
        time: 2015/03 - 2018/03
        show: True
        company: UniCredit Services, Bukarest
        details: |
          **Global Pricing Tool** – Modernisering av en Java-monolit till mikrotjänster med Scala, Python, Hazelcast, Angular och Docker.

          **Fund Transfer Price** – Teknisk ledare och arkitekt för en prototyp med Spring Batch, Spring Boot, MyBatis, Vaadin och Teradata. Ansvarade för tre utvecklare och byggde CI/CD med Jenkins och Docker.

          **BUL** – Migrering av en batchplattform till ny serverinfrastruktur samt integration med WebSphere och CI/CD-flöden.

      - role: Javautvecklare
        time: 2011/10 - 2015/03
        show: True
        company: Intuitext/Softwin, Bukarest
        details: |
          Utvecklade LMS- och LCMS-lösningar för digitalt lärande, onlinekurser, uppföljning av framsteg och kunskapsbedömning.

      - role: Javautvecklare
        show: True
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bukarest
        details: |
          Utvecklade ett system för fastighets- och ägarundersökningar med integrationer mot externa webbplatser och lagring i MySQL. Teknikstack: GWT, Servlets, MySQL och Resin.

      - role: Fullstackutvecklare inom Java
        time: 2005/04 - 2009/03
        company: INGENIO-UCS, Genesys och Concept Data, Bukarest


