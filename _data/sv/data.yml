experiences:
    title: Erfarenheter
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sverige
        details: |
          Jag har varit involverad i flera projekt.<br /><br />
          **SOS-VIDEO till 112** - Syftet med projektet är att lägga till video till ett befintligt nödsamtal till 112 genom att skicka ett 
          SMS-meddelande med en länk som den hjälpsökande ska öppna för att upprätta en videoförbindelse med operatören som hanterar samtalet.
          Detta uppnås genom att använda en öppen källkodsstack med Janus som videoserver, en internt inbyggd SIP-stack samt två Quarkus-applikationer 
          som sitter högst upp i flödet.
          Distributionspipelinen har automatiserats med GitLab, Ansible och Docker på plats.
          **Teknikstack:** Java, Quarkus, SIP, Janus, Docker, GitLab CI/CD och Ansible.<br /><br />
          **Driftorder Demo Application** - En demonstrationsapplikation för Driftorder BPMN-processen byggd med Spring Boot och Flowable.
          Jag utvecklade integrationen med Form.io.
          **Teknikstack:** Java, Spring Boot, Flowable, BPMN och Form.io.<br /><br />
          **AI Application Modernization POC** – En AI-baserad applikation utvecklad för att hjälpa utvecklare att samla in och analysera projektdata samt identifiera möjligheter till förbättring och modernisering.
          Det var första kontakten med ett AI-projekt och jag fick praktisk erfarenhet med verktyg som
          Chainlit, LangGraph, LangChain, Elasticsearch samt uppfräschning av
          Docker Compose och Python.
          **Teknikstack:** Python, Chainlit, LangGraph, LangChain, Elasticsearch och Docker Compose.<br /><br />
          **RSS** – Fullstack-utveckling för en applikation på AWS som stödjer ett företag
          som gör kommersiell handel för småelektronik. Jag var ansvarig för utveckling, underhåll och integration med 
          ett annat system, Upsales.          
          **Teknikstack:**  Neo4j med Cypher, Typescript med NestJS och Angular, GraphQL och AWS.<br /><br />
          **Friends MDT** – Utveckling av digitala enkätverktyg för Friends-stiftelsen i deras arbete mot mobbning och trakasserier.
          Applikationen användes för insamling av data från skolor genom att genomföra enkäter med syfte att visualisera
          och analysera resultaten.
          Efter insamlingen genererades en komplex rapport baserad på forskning som visar barnens välmående i skolan.
          Teknikstack: PostgreSQL, Neo4j, Spring Boot med Kotlin, Angular, AWS och Amazon Cognito för användar- och identitetshantering. 
          I projektets första fas använde vi VMware Tanzu för CI/CD.

      - role: Programvaruutvecklare @Payments
        time: 2021/05 - 2023/05
        show: True
        company: Leovegas, Remote-Sverige
        details: |
          Teamet i betalningsavdelningen bygger och underhåller betalningsintegrationer 
          mellan våra kärnsystem och olika betalningsleverantörer och betalningsmetoder 
          vilket möjliggör för spelaren att sätta in och ta ut pengar på ett smidigt sätt. 
          Min roll låg inom kortströmmen som specifikt hanterar kortbetalningsintegrationer. 
          Vårt mål är att sänka kostnaden per betalning, utöka våra nuvarande betalningsmetoder 
          och minska risken för bedrägerier vid betalningar. 
          Som medlem i kortströmmen var jag involverad i att bygga två integrationer med betalningsleverantörer
          och regelmotorn som används för att skapa regler för risk- och bedrägeribekämpning.
          **Teknikstack:**  En mikrotjänstarkitektur byggd över ett internt Spring Boot-liknande ramverk 
          med Kotlin och MySql som databas. Vi distribuerade våra mikrotjänster i Google Cloud och 
          vi använde oss av Kubernetes för containerplattform.<br />
          **Teamet**: 3–5 strömsmedlemmar, 30+ utökat team
          <br /><br />

      - role: Principal Programvaruingenjör
        show: False
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Rumänien
        details: |
          Vårt avdelningsmål är att minska risken när ett lån begärs av en kund.
          Jag var involverad i att bygga verktyg som hjälper till att automatisera vissa uppgifter i vår avdelning.
          Byggde en webbapp som automatiserade övervakning och distribution av våra 20+ Blaze-inställningar. I det här projektet
          byggde vi bland annat en CI/CD pipeline med GitLab, Artifactory och Pivotal Cloud Foundry. Denna app ökade nöjdheten 
          hos våra kollegor som ansvarar för att släppa nya versioner och underlättade övervakningen
          av våra instanser under högsäsong. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB.          
          Jag var involverad i att skapa en webbapp som hjälper våra kollegor att granska och verifiera misstänkta 
          transaktioner. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB. Jag skrev om och förbättrade 
          ett befintligt automatiserat testningsramverk som gör det möjligt för våra utvecklare att testa sin kod mot 
          förväntade utfall.
          Lyckades även integrera SSO-funktionalitet i våra webbappar med hjälp av Waffle.          
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.          
          **Teknikstack:** Groovy, MongoDB, Akka, Angular, Servlets, GitLab CI/CD, Artifactory, Pivotal Cloud Foundry och Waffle SSO.
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.

      - role: Senior Programvaruutvecklare
        time: 2015/03 - 2018/03
        show: True
        company: UniCredit Services, Bukarest
        details: |
         Jag arbetade med olika "prismotorer" för våra Unicredit-kollegor från Italien.<br /><br />
         **GPT (Global Pricing Tool)**  Vi byggde om den här projekt från en monolit byggd på en Java-teknikstack 
         till en mikrotjänstinfrastruktur med Scala för mikrotjänsterna, Python för 
         beräkningsmotorn, Hazelcast för cachelagring av data och Angular för frontend. Vi använde även SBT 
         för att bygga Scala-mikrotjänsterna. Vi strävade efter att ge användarna en mer behaglig upplevelse 
         och lyckades med det genom att öka webbappens hastighet och motståndskraft. Mikrotjänsterna 
         distribuerades slutligen på Docker.
         **Teamet**  för detta projekt bestod av en teknisk analytiker, affärsanalytiker och sex utvecklare. 
         Vi arbetade enligt agil metodik.
         **Teknikstack:** Java, Scala, Play Framework, SBT, Python, AngularJS, JavaScript, Hazelcast, Teradata SQL, Spring Batch, Maven, WebSphere, JasperReports, Jenkins, Jira, Docker och mikrotjänster.<br /><br />
         **BUL-Batch-plattform/beräkningsmotor**  I 4 månader bidrog jag till migreringen av en viktig applikationill en ny serverinfrastruktur. En viktig del av arbetet var att integrera applikationen i företagets servrar 
         och CI/CD-pipelines. Detta innebar samarbete med teamet  som ansvarade för WebSphere-servrarna samt teamet  som 
         hanterade CI/CD-verktyget (Gandalf), eftersom vissa inställningar inte kunde göras av mig själv.
         **Teknikstack:** EJB 2.0, JMS, WebSphere 5 och 8 samt interna CI/CD-verktyg.<br /><br />
         **BUL-CT1** – Jag ansvarade för övertagandet av applikationen från en annan avdelning och samordnade överföringen av teknisk kunskap och operativt ansvar.
         **Teknikstack:** EJB 2.0, JMS, WebSphere 6 och 8 samt interna CI/CD-verktyg.<br /><br />
         **Fund Transfer Price** Jag byggde en POC för  Fund Transfer Price plattformen - Batch-plattform/beräkningsmotor med en öppen källkodsstack: 
         Spring Batch, Spring Boot, MyBatis, Vaadin, men använde den tidigare Teradata-databasen. Vi byggde vår CI/CD med Jenkins och använde Docker för moduler.
         **Teknikstack:** Java, Spring Batch, Spring Boot, MyBatis, Vaadin, Teradata, Jenkins och Docker.
         **Teamet**: Jag agerade som teamlead/arkitekt i den här roll och var ansvarig för tre andra utvecklare.<br /><br />
         **Exonus** – Jag hade även en mindre roll i detta extraherings-, laddnings- och rapporteringsprojekt som senior utvecklare och arkitekturrådgivare.
         **Teknikstack:** Spring Boot, Spring Cloud, MongoDB, SQL-databaser, BIRT och Angular 2.

      - role: Javautvecklare
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bukarest
        details: |
          Jag arbetade med LMS-, LCMS- och utvärderingsplattformar som hjälpte studenter och yrkesverksamma att tillägna sig kunskap,
          genomföra onlinekurser, mäta framsteg och utvärdera läranderesultat.<br /><br />
          **INSAM** – En utvärderingsplattform för rumänska gymnasieelever. Jag utvecklade funktioner och åtgärdade fel.
          **Teknikstack:** Java, Hibernate, Spring, Struts 1, MySQL, BIRT och Tomcat.<br /><br />
          **ISMB-SIND, CMBRAE och FORCAD-VN** – Jag anpassade befintliga moduler och utvecklade ny funktionalitet enligt kundernas krav.
          **Teknikstack:** Java, MySQL, Hibernate, Spring, Spring MVC, JSP, jQuery och Tomcat.<br /><br />
          **Matematici och PREVINS** – Jag utvecklade och underhöll funktionalitet för lärande och utvärdering.
          **Teknikstack:** Java, Spring MVC, Maven, jQuery, Hibernate, Spring, PostgreSQL och Tomcat.<br /><br />
          **Alpha Bank och ING:s e-learningplattformar** – SCORM-baserade lärplattformar som jag utvecklade och underhöll.
          **Teknikstack:** Java, Struts, Hibernate, MySQL, SCORM och JBoss.

      - role: Java Developer
        show: False
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bukarest
        details: |
          Jag utvecklade och underhöll en applikation för fastighets- och ägarundersökningar genom att integrera nya webbplatser 
          med hjälp av Http Client API, HTML Parser API, reguljära uttryck och XML. Den insamlade informationen från de integrerade webbplatserna sparades sedan i applikationens MySQL-databas för vidare användning.  
          Syftet med Title Search-applikationen var att göra det möjligt för användaren att samla in all tillgänglig information om en fastighet eller en fastighetssäljare, för att göra fastighetsaffären så säker som möjligt och minimera risker som kan påverka köparen.          
          **Teknikstack:** Java, GWT, JSP, Servlets, MySQL, HTML Parser, HTTP Client, XML, reguljära uttryck och Resin.
          **Teamet**  bestod av 8 utvecklare, 3 testare och en utvecklingsledare.

      - role: Fullstack Java Developer
        time: 2007/06 - 2009/03
        company: Concept Data, Bukarest
        details: |
          TasKAFE var en projekthanteringsapp med funktioner som resursallokering, tids- och kostnadsregistrering samt rapporteringsverktyg. Nya moduler utvecklades för HR, lager, redovisning och dokumenthantering.
          **Teknikstack:** Java, Swing, Hibernate, Oracle, PostgreSQL, Spring, JSF, RMI, Java Web Start, Ant, Maven, JUnit, iText och JasperReports.
          Team hade 5 utvecklare och en testare.

      - role: Fullstack Java Developer
        time: 2007/02 - 2007/06
        company: Genesys, Bucharest
        details: |
          **Gesy Framework** – Jag underhöll och vidareutvecklade ett internt applikationsramverk.
          **Teknikstack:** Java, JSF, Ajax, SWT och Microsoft SQL Server.

      - role: Fullstack Java Developer
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bukarest
        details: |
          Jag utvecklade och gav support för interna och kundinriktade applikationer, inklusive lösningar för kreditbedömning och låneberäkning för rumänska banker.<br /><br />
          **Allia Intranet** – Jag utvecklade ny funktionalitet och åtgärdade fel i en intern webbapplikation.
          **Teknikstack:** Java, Struts, JSP, Servlets, jQuery och MySQL.<br /><br />
          **Neural-BCR** – Jag underhöll en applikation för kreditbedömning och låneberäkning för BCR.
          **Teknikstack:** Java, Struts, JSP, Servlets, Oracle och PL/SQL.

