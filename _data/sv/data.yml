experiences:
  title: Erfarenheter
  info:
    - role: Lead Solutions Consultant
      show: True
      time: 2023/05 - 2026/07
      company: Tietoevry, Kalmar, Sverige
      summary: Utvecklade Java- och Quarkus-baserade kommunikationsflöden för SOS-VIDEO till 112 samt fullstacklösningar med Spring Boot, Kotlin, TypeScript och Angular.
      details: |
        - **SOS-VIDEO till 112:** Utvecklade, integrerade och kvalitetssäkrade videoflödet ovanpå Janus, en intern SIP-stack och Quarkus-applikationer för att möjliggöra stabila videosamtal som komplement till röstsamtal till 112. Distributionspipelinen automatiserades med GitLab, Ansible och Docker.
        - **Friends MDT:** Byggde ett digitalt enkätsystem som ersatte pappersenkäter och kompletterades med en forskningsbaserad rapport, vilket gav skolor ett bättre beslutsunderlag kring elevers välmående. Använde PostgreSQL och JPA.
        - **RSS:** Utvecklade funktionalitet för databastrensning och integration mot Upsales som förenklade och effektiviserade säljarnas och köparnas dagliga arbete i handelsapplikationen på AWS.
        - **Driftorder:** Tog fram en demoapplikation (Spring Boot, Flowable, Form.io-integration) för att visa Driftorder-BPMN-processen i kunddialoger.
        - **AI Application Modernization POC:** Tog fram en POC med Chainlit, LangGraph, LangChain, Elasticsearch, Docker Compose och Python för att demonstrera hur AI kan stödja moderniseringen av befintliga system.

        **Teknikstack:** Java, Quarkus, Spring Boot, JPA, Kotlin, TypeScript, Angular, NestJS, GraphQL, Neo4j, PostgreSQL, AWS, GitLab, Ansible och Docker.

    - role: Systemutvecklare, Payments
      time: 2021/05 - 2023/05
      show: True
      company: LeoVegas, Remote-Sverige
      summary: Utvecklade betalningsintegrationer och regler för bedrägeribekämpning i Kotlin-baserade mikrotjänster med JPA, MySQL, Google Cloud och Kubernetes.
      details: |
        - Byggde två kortbetalningsintegrationer och en regelmotor som valde betalningsleverantör per marknad, sänkte transaktionskostnaderna och stärkte regelefterlevnaden, bland annat genom att stoppa oönskade transaktioner.
        - Samarbetade med datainsamlingsteamet om spårning och analys av betalflöden (cirka 30 MEUR per månad) och vidareutvecklade datalagret med SQL i Liquibase samt anpassade JPA-entiteter för nya funktioner.
        - Deltog i analys, implementation, PR reviews, CI/CD-driftsättning och övervakning av mikrotjänster i Marathon och Kubernetes på Google Cloud. Använde Datadog och ELK för felsökning och föreslog förbättringar av driftsättningsprocessen. Bidrog även i utvecklarintervjuer.

        **Teknikstack:** Kotlin, internt Spring Boot-liknande ramverk, JPA, MySQL, Liquibase, mikrotjänster, Marathon, Kubernetes, Google Cloud, Datadog och ELK-stacken.<br />
        **Teamet:** 3–5 teammedlemmar, 30+ i det utökade teamet.

    - role: Principal Software Engineer
      show: True
      time: 2018/03 - 2021/05
      company: Dell Financial Services, Remote-Rumänien
      summary: Utvecklade Angular-baserade verktyg för riskgranskning, automatiserad testning och driftsättning inom finans.
      details: |
        - Byggde en webbapp som automatiserade övervakning och driftsättning av 20+ Blaze-inställningar, vilket ökade nöjdheten hos kollegor som ansvarade för releaser och förenklade övervakningen under högsäsong (CI/CD med GitLab, Artifactory och Pivotal Cloud Foundry). Verktyget togs emot mycket positivt vid demonstrationen.
        - Utvecklade en webbapp som stöd för kollegor i granskning och verifiering av misstänkta transaktioner, vilket minskade manuellt arbete och förbättrade kvaliteten och effektiviteten i riskbedömningen, eftersom de tidigare arbetade i Excel-ark.
        - Skrev om och förbättrade ett automatiserat testramverk så att utvecklare kunde verifiera kod och systemflöden mot förväntade utfall och upptäcka regressioner tidigare i utvecklingsprocessen.
        - Integrerade SSO i webbapparna med Waffle för att förenkla inloggning, öka säkerheten och säkerställa rätt behörigheter för olika användare. Jag tog över uppgiften när en kollega inte kom vidare.
        - Implementerade Blaze FICO-regler som en del av avdelningens arbete med att minska risken när kunder ansöker om lån.
        
        **Teknikstack:** Angular, Groovy, Servlets, MongoDB, Akka, GitLab, Artifactory och Pivotal Cloud Foundry.

    - role: Senior systemutvecklare
      time: 2015/03 - 2018/03
      show: True
      company: UniCredit Services, Bukarest
      summary: Moderniserade Java- och fullstacklösningar och byggde en Spring Boot-baserad POC med MyBatis, Teradata, Vaadin och Docker.
      details: |
        - Arbetade som senior utvecklare med prismotorer för UniCredit-kollegor i Italien och bidrog i kritiska delar av GPT (Global Pricing Tool) när projektet byggdes om från Java-monolit till mikrotjänster i Scala (tjänster), Python (beräkningsmotor), Hazelcast (cache) och Angular (frontend), distribuerat på Docker.
        - Drev införandet av enhetstester i GPT för att höja kodkvaliteten och minska antalet buggar under den krävande ombyggnaden. Ledde dialoger med intressenter vid prestandaproblem och med kunden för att förklara den förbättrade precisionen när BigDecimal infördes i stället för Float.
        - Bidrog under fyra månader till migreringen av BUL-batchplattformen/beräkningsmotorn till ny serverinfrastruktur genom att integrera applikationen mot företagets WebSphere-servrar (5 och 8) och CI/CD-verktyget Gandalf, i nära samarbete med plattformsteamen.
        - Migreringen tog bort ett beroende till Tibco GRID och innebar en kostnadsminskning på flera hundratusen dollar per år.
        - Byggde en POC för Fund Transfer Price-plattformen på en öppen källkodsstack (Spring Batch, Spring Boot, MyBatis, Vaadin) ovanpå den befintliga Teradata-databasen. Byggde driftsättningspipelinen med Jenkins för Docker-moduler på Mesos/Marathon.
        - Agerade teamlead och arkitekt för tre utvecklare i Fund Transfer Price-initiativet: gav teknisk vägledning, samordnade utvecklingsarbetet och drev arkitekturella beslut tillsammans med teamet i en agil miljö.

    #         Hade även en mindre roll i Exonus-projektet som byggdes med Spring Cloud-infrastruktur.

    - role: Javautvecklare
      time: 2011/10 - 2015/03
      show: True
      company: Intuitext/Softwin, Bukarest
      summary: Utvecklade Java-baserade webbapplikationer och lärplattformar med Spring, Hibernate, PostgreSQL och MySQL.
      details: |
        Jag utvecklade och underhöll LMS-, LCMS- och utvärderingsplattformar för skolor, yrkesverksamma och banker.
        Arbetet omfattade datamodellering, persistenslager och utveckling av webbapplikationer med Java, Spring och Hibernate.
        **Teknikstack:** Java, Spring, Spring MVC, Hibernate, Struts, JSP, PostgreSQL, MySQL, Maven, jQuery, Tomcat och JBoss.

    - role: Javautvecklare
      show: False
      time: 2009/04 - 2011/08
      company: Advantage Title Solutions, Bukarest
      summary: Utvecklade en Java-applikation för fastighetssökning med integrationer mot externa webbplatser och MySQL-persistens.
      details: |
        Jag utvecklade och underhöll en applikation för fastighets- och ägarundersökningar genom att integrera nya webbplatser 
        med hjälp av Http Client API, HTML Parser API, reguljära uttryck och XML. Den insamlade informationen från de integrerade webbplatserna sparades sedan i applikationens MySQL-databas för vidare användning.  
        Syftet med Title Search-applikationen var att göra det möjligt för användaren att samla in all tillgänglig information om en fastighet eller en fastighetssäljare, för att göra fastighetsaffären så säker som möjligt och minimera risker som kan påverka köparen.          
        **Teknikstack:** GWT, Servlets, MySQL och Resin.        
        **Teamet**  bestod av 8 utvecklare, 3 testare och en utvecklingsledare.

    - role: Fullstack-Javautvecklare
      time: 2007/06 - 2009/03
      show: True
      company: Concept Data, Bukarest
      summary: Utvecklade en Java-baserad projekthanteringsplattform med Hibernate, Spring, JSF, Oracle och PostgreSQL.
      details: |
        Jag utvecklade TasKAFE, en projekthanteringsapplikation med funktioner för resursallokering, tids- och kostnadsregistrering samt rapportering. Lösningen innehöll även moduler för HR, lager, redovisning och dokumenthantering.
        Arbetet omfattade datamodellering och persistens med Hibernate mot Oracle och PostgreSQL.
        **Teknikstack:** Java, Hibernate, Spring, JSF, Oracle, PostgreSQL, Swing, RMI, Java Web Start, Ant, Maven, JUnit, iText och JasperReports.

    - role: Fullstack-Javautvecklare
      time: 2007/02 - 2007/06
      show: False
      company: Genesys, Bukarest
      summary: Underhöll och vidareutvecklade ett internt Java-ramverk med JSF, Ajax och Microsoft SQL Server.

    - role: Fullstack-Javautvecklare
      time: 2005/04 - 2007/02
      show: False
      company: INGENIO-UCS, Bukarest
      summary: Utvecklade och underhöll Java-baserade intranät- och bankapplikationer med Struts, JSP och Servlets. Arbetade med datamodellering och persistens med JDBC och SQL mot Oracle, inklusive stored procedures.


