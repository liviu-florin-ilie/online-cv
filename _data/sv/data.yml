career-profile:
  title: Karriärprofil
  summary: |
    Senior fullstack- och lösningsorienterad programvaruutvecklare med över 20 års erfarenhet av att utveckla affärskritiska system och omsätta verksamhetsbehov till robusta lösningar i produktion. Jag har arbetat i konsultnära och distribuerade miljöer med backend, integrationer, frontend, CI/CD och tekniska vägval.

    På Tietoevry har jag bland annat utvecklat lösningar för SOS Alarm, Friends och molnbaserade affärssystem samt deltagit i en AI-baserad lösning för analys och modernisering av programvara. Där arbetade jag praktiskt med Python, LangChain, LangGraph, Chainlit, Elasticsearch och Docker Compose. Jag är även certifierad **Microsoft Azure AI Engineer Associate (AI-102)**.

    Jag använder AI-verktyg som Codex och IntelliJ AI i utvecklingsarbetet för analys, implementation, felsökning, test och dokumentation, med eget ansvar för granskning och kvalitetssäkring. Min styrka är kombinationen av teknisk bredd, lång erfarenhet och förmågan att skapa hållbara lösningar när både problemet och vägen framåt behöver konkretiseras.
