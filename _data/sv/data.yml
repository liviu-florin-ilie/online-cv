experiences:
    title: Erfarenheter
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sverige
        summary: Fullstackutveckling med Kotlin, Spring Boot, PostgreSQL och TypeScript, Java-baserade integrationer till 112 samt en AI-baserad POC för applikationsmodernisering.
        details: |
          **SOS-VIDEO till 112:** Utvecklade integrations- och kommunikationsflöden för en lösning som lade till ett videosamtal till ett befintligt ljudsamtal till 112. Den hjälpsökande fick ett SMS med en länk för att upprätta en videoförbindelse med operatören som hanterade samtalet. Automatiserade driftsättningen med GitLab CI/CD, Ansible och Docker.
          **Teknik:** Java, Quarkus, SIP och Janus.

          **Friends MDT:** Utvecklade digitala enkätverktyg som samlade in, analyserade och visualiserade skolors data om barns välmående och genererade forskningsbaserade rapporter.
          **Teknik:** **Kotlin, Spring Boot, PostgreSQL**, Neo4j, Angular, AWS och Cognito; VMware Tanzu för CI/CD i första fasen.

          **AI Application Modernization POC:** Bidrog till en AI-applikation för insamling och analys av projektdata samt identifiering av förbättrings- och moderniseringsmöjligheter.
          **Teknik:** Python, Chainlit, **LangGraph, LangChain**, Elasticsearch och Docker Compose.

          **RSS och Driftorder:** Ansvarade för fullstackutveckling, underhåll och Upsales-integration i en AWS-applikation med TypeScript, NestJS, Angular, GraphQL och Neo4j. Utvecklade även Form.io-integrationen i en BPMN-demo med **Java, Spring Boot och Flowable**.

      - role: Programvaruutvecklare @Payments
        time: 2021/05 - 2023/05
        show: True
        company: LeoVegas, Remote-Sverige
        summary: Byggde integrationer med kortbetalningsleverantörer och regler för bedrägeribekämpning med Kotlin-mikrotjänster i Google Cloud.
        details: |
          Utvecklade och underhöll **affärskritiska betalningsintegrationer** mellan kärnsystem och kortbetalningsleverantörer för insättningar och uttag. Arbetet syftade till smidigare betalningar, lägre transaktionskostnader och minskad bedrägeririsk.

          Bidrog till **två betalningsleverantörsintegrationer** och regelmotorn för risk- och bedrägeribekämpning. Arbetade i en kortbetalningsgrupp med 3–5 personer inom en större betalningsorganisation.

          **Teknik:** **Kotlin, mikrotjänster och MySQL**, ett internt Spring Boot-liknande ramverk samt **Google Cloud och Kubernetes** för driftsättning.

      - role: Principal Programvaruingenjör
        show: False
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Rumänien
        summary: Automatiserade driftsättningen av beslutsplattformar och utvecklade verktyg för riskgranskning och testning inom finans.
        details: |
          Vårt avdelningsmål är att minska risken när ett lån begärs av en kund.
          Jag var involverad i att bygga verktyg som hjälper till att automatisera vissa uppgifter i vår avdelning.
          Byggde en webbapp som automatiserade övervakning och distribution av våra 20+ Blaze-inställningar. I det här projektet
          byggde vi bland annat en CI/CD pipeline med GitLab, Artifactory och Pivotal Cloud Foundry. Denna app ökade nöjdheten 
          hos våra kollegor som ansvarar för att släppa nya versioner och underlättade övervakningen
          av våra instanser under högsäsong. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB.          
          Jag var involverad i att skapa en webbapp som hjälper våra kollegor att granska och verifiera misstänkta 
          transaktioner. Teknikstack för denna app: Angular, Groovy, Servlets, MongoDB. Jag skrev om och förbättrade 
          ett befintligt automatiserat testningsramverk som gör det möjligt för våra utvecklare att testa sin kod mot 
          förväntade utfall.
          Lyckades även integrera SSO-funktionalitet i våra webbappar med hjälp av Waffle.          
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.
          **Teknikstack:** Groovy, MongoDB, Akka, Angular, Servlets, GitLab CI/CD, Artifactory, Pivotal Cloud Foundry och Waffle SSO.
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.

      - role: Senior Programvaruutvecklare
        time: 2015/03 - 2018/03
        show: True
        company: UniCredit Services, Bukarest
        summary: Moderniserade pris- och batchplattformar, ledde en konceptstudie för Fund Transfer Price och bidrog med lösningsarkitektur.
        details: |
         **Global Pricing Tool:** Bidrog till modernisering från en **Java-monolit till mikrotjänster**, med målet att förbättra webbapplikationens hastighet, motståndskraft och användarupplevelse. Samarbetade med teknisk analytiker, affärsanalytiker och sex utvecklare i ett agilt team.
         **Teknik:** Java, Scala, Play Framework, Python, AngularJS, Hazelcast, Teradata SQL och Docker.

         **Fund Transfer Price:** Agerade under cirka sex månader som **team lead och lösningsarkitekt för tre utvecklare**. Analyserade krav, utvärderade teknik och tog fram arkitektur samt POC för en ny batch- och beräkningsplattform utifrån verksamhetens behov och teamets kompetens.
         **Teknik:** **Java, Spring Boot, Spring Batch**, MyBatis, Vaadin, Teradata, Jenkins och Docker.

         **BUL och Exonus:** Bidrog till migrering av en beräkningsapplikation och samordnade integration med serverinfrastruktur och CI/CD-team. Ansvarade även för applikationsövertagande och kunskapsöverföring. Gav utvecklings- och arkitekturstöd i ett extraherings- och rapporteringsprojekt med **Spring Boot, Spring Cloud, SQL**, MongoDB, BIRT och Angular 2.

      - role: Javautvecklare
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bukarest
        summary: Utvecklade och underhöll Java-baserade lär- och utvärderingsplattformar för skolor, yrkesverksamma och banker.
        details: |
          Jag arbetade med LMS-, LCMS- och utvärderingsplattformar som hjälpte studenter och yrkesverksamma att tillägna sig kunskap,
          genomföra onlinekurser, mäta framsteg och utvärdera läranderesultat.<br /><br />
          **INSAM** – En utvärderingsplattform för rumänska gymnasieelever. Jag utvecklade funktioner och åtgärdade fel.
          **Teknikstack:** Java, Hibernate, Spring, Struts 1, MySQL, BIRT och Tomcat.<br /><br />
          **ISMB-SIND, CMBRAE och FORCAD-VN** – Jag anpassade befintliga moduler och utvecklade ny funktionalitet enligt kundernas krav.
          **Teknikstack:** Java, MySQL, Hibernate, Spring, Spring MVC, JSP, jQuery och Tomcat.<br /><br />
          **Matematici och PREVINS** – Jag utvecklade och underhöll funktionalitet för lärande och utvärdering.
          **Teknikstack:** Java, Spring MVC, Maven, jQuery, Hibernate, Spring, PostgreSQL och Tomcat.<br /><br />
          **Alpha Bank och ING:s e-learningplattformar** – SCORM-baserade lärplattformar som jag utvecklade och underhöll.
          **Teknikstack:** Java, Struts, Hibernate, MySQL, SCORM och JBoss.

      - role: Java Developer
        show: False
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bukarest
        summary: Utvecklade och underhöll en Java-applikation för fastighetssökning som samlade in uppgifter från externa webbplatser.
        details: |
          Jag utvecklade och underhöll en applikation för fastighets- och ägarundersökningar genom att integrera nya webbplatser 
          med hjälp av Http Client API, HTML Parser API, reguljära uttryck och XML. Den insamlade informationen från de integrerade webbplatserna sparades sedan i applikationens MySQL-databas för vidare användning.  
          Syftet med Title Search-applikationen var att göra det möjligt för användaren att samla in all tillgänglig information om en fastighet eller en fastighetssäljare, för att göra fastighetsaffären så säker som möjligt och minimera risker som kan påverka köparen.          
          **Teknikstack:** Java, GWT, JSP, Servlets, MySQL, HTML Parser, HTTP Client, XML, reguljära uttryck och Resin.
          **Teamet**  bestod av 8 utvecklare, 3 testare och en utvecklingsledare.

      - role: Fullstack Java Developer
        time: 2007/06 - 2009/03
        company: Concept Data, Bukarest
        summary: Utvecklade TasKAFE, en Java-baserad projekthanteringsplattform. Nya moduler utvecklades för rapportering till skattemyndigheten, lager och redovisning.
        details: |
          TasKAFE var en projekthanteringsapp med **resursallokering, tids- och kostnadsregistrering samt rapportering**. Jag utvecklade funktionalitet för dessa verksamhetsflöden med Java och SQL-databaser.
          Nya moduler utvecklades för rapportering till skattemyndigheten, lager och redovisning.
          **Teknikstack:** Java, Swing, Hibernate, Oracle, PostgreSQL, Spring, JSF, RMI, Java Web Start, Ant, Maven, JUnit, iText och JasperReports.
          Team hade 5 utvecklare och en testare.

      - role: Fullstack Java Developer
        time: 2007/02 - 2007/06
        company: Genesys, Bucharest
        summary: Underhöll och vidareutvecklade Gesy, ett Java- och JSF-baserat ramverk som genererade applikationer med CRUD-funktioner utifrån definitioner av entiteter och deras relationer.
        details: |
          **Gesy Framework** – Jag underhöll och vidareutvecklade ett ramverk där entiteter och relationerna mellan dem kunde definieras. Utifrån dessa definitioner genererade ramverket en applikation med CRUD-funktioner för att skapa, läsa, uppdatera och ta bort data.
          **Teknikstack:** Java, JSF, Ajax, SWT och Microsoft SQL Server.

      - role: Fullstack Java Developer
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bukarest
        summary: Utvecklade intranät- och bankapplikationer, bland annat lösningar för kreditbedömning och låneberäkning.
        details: |
          Jag utvecklade och gav support för interna och kundinriktade applikationer, inklusive lösningar för kreditbedömning och låneberäkning för rumänska banker.<br /><br />
          **Allia Intranet** – Jag utvecklade ny funktionalitet och åtgärdade fel i en intern webbapplikation.
          **Teknikstack:** Java, Struts, JSP, Servlets, jQuery och MySQL.<br /><br />
          **Neural-BCR** – Jag underhöll en applikation för kreditbedömning och låneberäkning för BCR.
          **Teknikstack:** Java, Struts, JSP, Servlets, Oracle och PL/SQL.

