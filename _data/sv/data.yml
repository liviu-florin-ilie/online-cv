experiences:
    title: Erfarenheter
    info:
      - role: Lead Solutions Consultant
        show: True
        time: 2023/05 - 2026/07
        company: Tietoevry, Kalmar, Sverige
        details: |
          Arbetade som Lead Solutions Consultant i flera uppdrag inom AI, backend, fullstackutveckling, integrationer och molnbaserade plattformar.<br />

          **SOS-VIDEO till 112** – Utvecklade delar av en driftskritisk lösning som kompletterar ett pågående 112-samtal med video. Lösningen bygger på Janus, en internt utvecklad SIP-stack och två Quarkus-applikationer. Distributionsflödet automatiserades med GitLab, Ansible och Docker i lokal driftmiljö.

          **Driftorder Demo Application** – Utvecklade integrationen med Form.io i en demonstrationsapplikation för en 
          BPMN-process, byggd med Spring Boot och Flowable.

          **AI Application Modernization POC** – Bidrog till utvecklingen av en AI-baserad applikation som samlar in och analyserar projektdata 
          samt identifierar möjligheter till förbättring och modernisering.
          <br />
          **Teknikstack:** Python, LangChain, LangGraph, Chainlit, Elasticsearch och Docker Compose.

          **RSS** – Ansvarade för fullstackutveckling, underhåll och integration med Upsales i en AWS-baserad affärsapplikation.
          <br />
          **Teknikstack:** TypeScript, NestJS, Angular, GraphQL, Neo4j och AWS.

          **Friends MDT** – Utvecklade en molnbaserad fullstacklösning för insamling, analys och rapportering av skolenkäter åt Friends.
          <br />
          **Teknikstack:** Kotlin, Spring Boot, Angular, PostgreSQL, Neo4j, AWS och VMware Tanzu för CI/CD.
      - role: Programvaruutvecklare @Payments
        time: 2021/05 - 2023/05
        show: True
        company: Leovegas, Remote-Sverige
        details: |
          Teamet i betalningsavdelningen bygger och underhåller betalningsintegrationer 
          mellan våra kärnsystem och olika betalningsleverantörer och betalningsmetoder 
          vilket möjliggör för spelaren att sätta in och ta ut pengar på ett smidigt sätt. 
          Min roll låg inom kortströmmen som specifikt hanterar kortbetalningsintegrationer. 
          Vårt mål är att sänka kostnaden per betalning, utöka våra nuvarande betalningsmetoder 
          och minska risken för bedrägerier vid betalningar. 
          Som medlem i kortströmmen var jag involverad i att bygga en av våra integrationer 
          och regelmotorn som används för att skapa regler för risk- och bedrägeribekämpning.
          <br />
          **Teknikstack:**  En mikrotjänstarkitektur byggd över ett internt Spring Boot-liknande ramverk 
          med Kotlin och MySql som databas. Vi distribuerade våra mikrotjänster i Google Cloud och 
          vi använde oss av Kubernetes för containerplattform.<br />
          **Teamet**: 3–5 strömsmedlemmar, 30+ utökat team

      - role: Principal Programvaruingenjör
        show: True
        time: 2018/03 - 2021/05
        company: Dell Financial Services, Remote-Rumänien
        details: |
          Vårt avdelningsmål är att minska risken när ett lån begärs av en kund.
          Jag var involverad i att bygga verktyg som hjälper till att automatisera vissa uppgifter i vår avdelning.
          Byggde en webbapp som automatiserade övervakning och distribution av våra 20+ Blaze-inställningar. I det här projektet
          byggde vi bland annat en CI/CD pipeline med GitLab, Artifactory och Pivotal Cloud Foundry. Denna app ökade nöjdheten 
          hos våra kollegor som ansvarar för att släppa nya versioner och underlättade övervakningen
          av våra instanser under högsäsong.
          <br />
          **Teknikstack:** Angular, Groovy, Servlets, MongoDB.
          
          Jag var involverad i att skapa en webbapp som hjälper våra kollegor att granska och verifiera misstänkta 
          transaktioner.
          <br />
          **Teknikstack:** Angular, Groovy, Servlets, MongoDB. 
          
          Jag skrev om och förbättrade 
          ett befintligt automatiserat testningsramverk som gör det möjligt för våra utvecklare att testa sin kod mot 
          förväntade utfall.
          Lyckades även integrera SSO-funktionalitet i våra webbappar med hjälp av Waffle.
          <br />
          **Teknikstack:**  Groovy, MongoDB, Akka, Angular.
          <br />
          **Teamet**  för ett projekt består av teamledare och en eller två utvecklare.

      - role: Senior Programvaruutvecklare
        time: 2015/03 - 2018/03
        show: True
        company: UniCredit Services, Bukarest
        details: |
         Jag arbetade med olika "prismotorer" för våra Unicredit-kollegor från Italien.
          
         **GPT (Global Pricing Tool)**  Vi byggde om den här projekt från en monolit byggd på en Java-teknikstack 
         till en mikrotjänstinfrastruktur med Scala för mikrotjänsterna, Python för 
         beräkningsmotorn, Hazelcast för cachelagring av data och Angular för frontend. Vi använde även SBT 
         för att bygga Scala-mikrotjänsterna. Vi strävade efter att ge användarna en mer behaglig upplevelse 
         och lyckades med det genom att öka webbappens hastighet och motståndskraft. Mikrotjänsterna 
         distribuerades slutligen på Docker.
         <br />
         **Teamet**  för detta projekt bestod av en teknisk analytiker, affärsanalytiker och sex utvecklare. 
         Vi arbetade enligt agil metodik.          
          
         **BUL-Batch-plattform/beräkningsmotor**  I 4 månader bidrog jag till migreringen av en viktig applikationill en ny serverinfrastruktur. En viktig del av arbetet var att integrera applikationen i företagets servrar 
         och CI/CD-pipelines. Detta innebar samarbete med teamet  som ansvarade för WebSphere-servrarna samt teamet  som 
         hanterade CI/CD-verktyget (Gandalf), eftersom vissa inställningar inte kunde göras av mig själv.
         Teknikstacken innehöll EJB2.0, JMS, WebSphere 5 och 8.          
         **Fund Transfer Price** Jag byggde en POC för  Fund Transfer Price plattformen - Batch-plattform/beräkningsmotor med en öppen källkodsstack: 
         Spring Batch, Spring Boot, MyBatis, Vaadin, men använde den tidigare Teradata-databasen.Vi byggde vår CI/CD med 
          Jenkins och använde Docker för moduler.
          <br />
          **Teamet**: Jag agerade som teamlead/arkitekt i den här roll och var ansvarig för tre andra utvecklare.  

#         Hade även en mindre roll i Exonus-projektet som byggdes med Spring Cloud-infrastruktur.

      - role: Javautvecklare
        time: 2011/10 - 2015/03
        company: Intuitext/Softwin, Bukarest
        details: |
          Jag arbetade med olika projekt inom eLearning-området. Projekten jag arbetade med var LMS (Learning 
          Management Systems)/LCMS (Learning Content Management Systems). Deras syfte var att hjälpa studenter och 
          yrkesverksamma att förvärva ny kunskap och färdigheter inom vissa områden. Plattformarna stödde att gå 
          igenom onlinekurser, kunde mäta framsteg och även bedöma kunskap. Det fanns tre olika typer av ramverk 

      - role: Java Developer
        show: False
        time: 2009/04 - 2011/08
        company: Advantage Title Solutions, Bucharest
        details: |
          Jag utvecklade och underhöll en applikation för fastighets- och ägarundersökningar genom att integrera nya webbplatser 
          med hjälp av Http Client API, HTML Parser API, reguljära uttryck och XML. Den insamlade informationen från de integrerade webbplatserna sparades sedan i applikationens MySQL-databas för vidare användning.  
          Syftet med Title Search-applikationen var att göra det möjligt för användaren att samla in all tillgänglig information om en fastighet eller en fastighetssäljare, för att göra fastighetsaffären så säker som möjligt och minimera risker som kan påverka köparen.          
          <br />
          **Teknikstack:** GWT, Servlets, MySQL och Resin.        
          <br />
          **Teamet**  bestod av 8 utvecklare, 3 testare och en utvecklingsledare.

      - role: Fullstack Java Developer
        time: 2007/06 - 2009/03
        company: Concept Data, Bucharest

      - role: Fullstack Java Developer
        time: 2007/02 - 2007/06
        company: Genesys, Bucharest

      - role: Fullstack Java Developer
        time: 2005/04 - 2007/02
        company: INGENIO-UCS, Bucharest


