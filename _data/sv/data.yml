career-profile:
  title: Karriärprofil
  summary: |
    Senior fullstackutvecklare med mer än 20 års erfarenhet av att utveckla och förvalta verksamhetskritiska system i tvärfunktionella och agila team. Jag har över tio års direkt erfarenhet av Java/J2EE och har fortsatt arbeta inom JVM-ekosystemet med Kotlin, Groovy, Scala, Spring Boot och Quarkus. På frontendsidan har jag flerårig erfarenhet av TypeScript och Angular och är van att röra mig mellan backend, frontend, integrationer och leveransmiljöer.

    Integrationer och mikrotjänster är en röd tråd i min karriär. På LeoVegas utvecklade jag betalningsintegrationer mot externa leverantörer i en mikrotjänstarkitektur. På Tietoevry har jag bland annat arbetat med två Quarkus-applikationer och kommunikationsflöden i SOS-VIDEO till 112 samt byggt integrationer mot externa system.

    Jag har arbetat med flera databastekniker, bland annat PostgreSQL, MySQL, Oracle, Neo4j och MongoDB. Tidigare i karriären utvecklade jag även lagrade procedurer i Oracle.

    Jag har erfarenhet av automatiserad testning och kvalitetssäkring av systemflöden. Hos Dell skrev jag om och förbättrade ett automatiserat testramverk för verifiering av kod mot förväntade utfall. Min praktiska erfarenhet av renodlad prestandatestautomatisering är mer begränsad, men jag är van vid att utveckla, felsöka och kvalitetssäkra integrationer i komplexa produktionsmiljöer.

    Jag har arbetat med Docker, Kubernetes, GCP och AWS samt bygg- och distributionsflöden med bland annat GitLab, Jenkins och Artifactory. Som teamlead och arkitekt har jag ansvarat för tre utvecklare, gett teknisk vägledning och drivit arkitekturella beslut. Jag bidrar aktivt till samarbete, kunskapsdelning och gemensamt kvalitetsansvar i teamet.

