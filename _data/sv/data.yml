career-profile:
  title: Karriärprofil
  summary: |
    Jag är en erfaren programvaruutvecklare med över 20 års erfarenhet av att utveckla och vidareutveckla affärskritiska system. 
    Min bakgrund ligger framför allt inom backendutveckling och kompletteras av erfarenhet inom lösningsarkitektur, systemintegrationer,
    moln- och containerplattformar, CI/CD och tekniskt ledarskap.
  
    Jag har över tio års direkt erfarenhet av Java/J2EE och har därefter fortsatt inom JVM-ekosystemet med bland annat 
    Kotlin, Groovy, Spring Boot och Quarkus. Jag har arbetat med distribuerade system, mikrotjänster, API och integrationsarkitektur 
    samt med AWS, GCP, Kubernetes, Docker, VMware Tanzu, WebSphere, GitLab CI/CD, Jenkins.
    
    På UniCredit agerade jag under en period som team lead/lösningsarkitekt och ansvarade bland annat för en POC för en ny Fund Transfer Price-plattform. 
    Arbetet omfattade tekniska vägval kring arkitektur, ramverk, batchhantering, databasintegration, containerisering och CI/CD.
    
    På Tietoevry har jag arbetat med både molnbaserade och on-premise-lösningar. Inom SOS-VIDEO till 112 arbetade 
    jag med integrations- och kommunikationsflöden i en lösning baserad på bland annat SIP, Janus, Quarkus, Docker, GitLab.
    
    Min långa utvecklarbakgrund gör att jag kan kombinera ett arkitekturperspektiv med förståelse för hur tekniska beslut påverkar implementation, integration, 
    driftsättning och långsiktig förvaltning. Jag trivs med att se helheten, diskutera tekniska alternativ och bidra till lösningar som är robusta, säkra och hållbara över tid.

