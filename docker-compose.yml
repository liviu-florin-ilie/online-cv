services:
  jekyll:
    image: jekyll/jekyll:3.8
    command: jekyll serve --force_polling
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll

  pdf:
    build:
      context: ./docker/pdf
    depends_on:
      - jekyll
    environment:
      BASE_URL: http://jekyll:4000/online-cv
      LANGUAGE: ${LANGUAGE:-en}
      OUTPUT: ${OUTPUT:-/output/liviu-florin-ilie-cv-en.pdf}
    volumes:
      - ./output/pdf:/output
    profiles:
      - pdf
